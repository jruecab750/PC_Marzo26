<style>
:root {
  color-scheme: dark;
  --bg: #15181b;
  --panel: rgba(24, 28, 32, 0.86);
  --panel-solid: #1c2125;
  --line: #2f363c;
  --ink: #f4f2ee;
  --muted: #a3acb5;
  --orange: #ff6b1a;
  --orange-deep: #d9500a;
  --cyan: #3fd4ff;
  --tape: #f2c230;
  --ok: #5ce39a;
  --display: "Barlow Condensed", "Arial Narrow", "Roboto Condensed", sans-serif;
  --body: "Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
  --mono: "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
html, body { height: 100%; }
[hidden] { display: none !important; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 15px; overflow: hidden; }
#app { height: 100%; display: flex; flex-direction: column; }
button { font: inherit; color: inherit; }
button:focus-visible, [tabindex]:focus-visible { outline: 2px solid var(--cyan); outline-offset: 2px; }

/* Barra superior: marca + selector de escenas */
.top { display: flex; align-items: center; gap: 14px; padding: 8px 16px; background: var(--panel-solid); border-bottom: 1px solid var(--line); min-width: 0; }
.brand { display: flex; align-items: baseline; gap: 8px; flex: none; }
.brand b { font-family: var(--display); font-size: 24px; letter-spacing: 0.02em; color: var(--orange); line-height: 1; }
.brand span { font-family: var(--display); font-size: 17px; color: var(--muted); letter-spacing: 0.04em; text-transform: uppercase; white-space: nowrap; }
.strip { display: flex; gap: 14px; overflow-x: auto; scrollbar-width: thin; min-width: 0; flex: 1; padding-bottom: 2px; }
.grp { display: flex; align-items: center; gap: 5px; flex: none; }
.grp > i { font-style: normal; font-family: var(--display); font-size: 13px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); margin-right: 2px; }
.chip { border: 1px solid var(--line); background: transparent; border-radius: 6px; padding: 5px 9px; cursor: pointer; font-family: var(--display); font-size: 16px; letter-spacing: 0.02em; white-space: nowrap; color: var(--ink); }
.chip:hover { border-color: var(--muted); }
.chip.done { color: var(--muted); }
.chip.on { background: var(--orange); border-color: var(--orange); color: #1a0d04; }

/* Escenario */
.stage { position: relative; flex: 1; min-height: 0; }
#gl { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
.card { position: absolute; top: 12px; left: 12px; width: min(330px, calc(100% - 24px)); background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; backdrop-filter: blur(6px); display: flex; flex-direction: column; gap: 8px; }
.card .tag { font-family: var(--display); font-size: 14px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--orange); }
.card h1 { margin: 0; font-family: var(--display); font-weight: 700; font-size: 26px; line-height: 1.05; text-wrap: balance; }
.card ul { margin: 0; padding-left: 18px; display: flex; flex-direction: column; gap: 3px; line-height: 1.35; }
.card li::marker { color: var(--tape); }
.card .formula { font-family: var(--mono); font-size: 13px; color: var(--tape); border: 1px solid rgba(242, 194, 48, 0.45); border-radius: 6px; padding: 6px 8px; }
.card canvas { align-self: center; width: 150px; height: 150px; }
.card .toggle { position: absolute; top: 8px; right: 8px; border: 0; background: transparent; cursor: pointer; color: var(--muted); font-size: 18px; line-height: 1; padding: 4px; }
.card.min { width: auto; padding: 8px 40px 8px 12px; }
.card.min > :not(.tag):not(.toggle) { display: none; }
.sub { position: absolute; left: 50%; bottom: 14px; transform: translateX(-50%); width: min(900px, calc(100% - 32px)); text-align: center; font-size: clamp(16px, 2.1vw, 22px); line-height: 1.35; background: rgba(10, 12, 14, 0.78); border-radius: 8px; padding: 8px 14px; text-wrap: balance; }
.sub:empty { display: none; }
.who { color: var(--orange); font-weight: 700; }

/* Portada */
.start { position: absolute; inset: 0; display: grid; place-items: center; background: radial-gradient(ellipse at 50% 40%, rgba(21, 24, 27, 0.35), rgba(21, 24, 27, 0.88)); }
.start > div { text-align: center; display: flex; flex-direction: column; gap: 12px; align-items: center; padding: 0 16px; }
.start h2 { margin: 0; font-family: var(--display); font-size: clamp(40px, 7vw, 72px); line-height: 0.95; letter-spacing: 0.01em; }
.start h2 em { font-style: normal; color: var(--orange); }
.start p { margin: 0; color: var(--muted); max-width: 46ch; line-height: 1.45; }
.go { border: 0; background: var(--orange); color: #1a0d04; font-family: var(--display); font-weight: 700; font-size: 24px; letter-spacing: 0.04em; border-radius: 8px; padding: 10px 28px; cursor: pointer; }
.go:hover { background: #ff8340; }

/* Controles */
.ctl { display: flex; align-items: center; gap: 8px; padding: 8px 16px calc(8px + env(safe-area-inset-bottom, 0px)); background: var(--panel-solid); border-top: 1px solid var(--line); flex-wrap: wrap; }
.btn { border: 1px solid var(--line); background: transparent; border-radius: 6px; min-width: 38px; height: 36px; padding: 0 10px; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 6px; }
.btn:hover { border-color: var(--muted); }
.btn.main { background: var(--ink); color: var(--bg); border-color: var(--ink); min-width: 46px; }
.btn[aria-pressed="false"] { color: var(--muted); }
.bar { flex: 1; min-width: 120px; height: 36px; display: flex; align-items: center; cursor: pointer; }
.bar > div { position: relative; height: 6px; width: 100%; background: var(--line); border-radius: 3px; }
.bar b { position: absolute; left: 0; top: 0; bottom: 0; background: var(--orange); border-radius: 3px; }
.bar s { position: absolute; top: -3px; width: 2px; height: 12px; background: rgba(244, 242, 238, 0.35); text-decoration: none; }
.time { font-family: var(--mono); font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; min-width: 86px; text-align: right; }
.btn svg { width: 18px; height: 18px; fill: currentColor; }
.btn .lbl { font-size: 13px; }
@media (max-width: 720px) {
  .brand span { display: none; }
  .card { top: 8px; left: 8px; }
  .card canvas { width: 110px; height: 110px; }
  .card h1 { font-size: 21px; }
  .btn .lbl { display: none; }
  .time { display: none; }
}
@media (prefers-reduced-motion: reduce) { .chip, .btn { transition: none; } }

    <button class="btn" id="view" aria-label="Volver a la vista de la escena"><svg viewBox="0 0 24 24"><path d="M12 5c-5 0-9 5-9 7s4 7 9 7 9-5 9-7-4-7-9-7zm0 11a4 4 0 1 1 0-8 4 4 0 0 1 0 8z"/></svg><span class="lbl">Vista</span></button>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const SCENES = /*__DATOS__*/null;

// ------------------------------------------------------------ geometría (coordenadas del plano, metros)
const P = (x, y) => ({ x, y });
const add = (a, b) => P(a.x + b.x, a.y + b.y);
const sub = (a, b) => P(a.x - b.x, a.y - b.y);
const mul = (a, k) => P(a.x * k, a.y * k);
const len = a => Math.hypot(a.x, a.y);
const nrm = a => { const l = len(a) || 1; return P(a.x / l, a.y / l); };
const mid = (a, b) => P((a.x + b.x) / 2, (a.y + b.y) / 2);
const dir = deg => P(Math.cos(deg * Math.PI / 180), Math.sin(deg * Math.PI / 180));
const polar = (c, r, deg) => add(c, mul(dir(deg), r));
const ang = (c, p) => Math.atan2(p.y - c.y, p.x - c.x) * 180 / Math.PI;
const W = (p, h = 0) => new THREE.Vector3(p.x, h, -p.y);  // plano (x, y) -> mundo (x, altura, -y)
const clamp01 = x => Math.max(0, Math.min(1, x));
const ease = x => { x = clamp01(x); return x * x * (3 - 2 * x); };
const fmtM = v => v.toFixed(2).replace('.', ',') + ' m';

// Plano 1
const A = P(0, 0), B = P(2.5, 0), C = P(2.5, 3.5), D = P(0, 3.5);
const M1 = P(1.25, 0), M2 = P(2.5, 1.75), M3 = P(1.25, 3.5), M4 = P(0, 1.75);
const E = P(1.25, -2), F = P(4.5, 1.75), G = P(1.25, 6), J = P(-2, 1.75), H = P(1.25, 4.75), I = P(3.25, 4.75);
function semicircle(p, q, inner) {
  const c = mid(p, q), r = len(sub(p, q)) / 2, a0 = ang(c, p);
  const plus = polar(c, r, a0 + 90), minus = polar(c, r, a0 - 90);
  return { c, r, a0, a1: len(sub(plus, inner)) < len(sub(minus, inner)) ? a0 - 180 : a0 + 180 };
}
const S_INF = semicircle(M1, E, B), S_DER = semicircle(F, B, M2), S_IZQ = semicircle(J, D, M4), S_SUP = semicircle(G, I, H);
const RX = 1.5;  // radio de la perpendicular en el extremo
const P1 = polar(A, RX, 0), P2 = polar(A, RX, 60), P3 = polar(A, RX, 120), P4 = sub(add(P2, P3), A);
const Q1 = polar(B, RX, 180), Q2 = polar(B, RX, 120), Q3 = polar(B, RX, 60), Q4 = sub(add(Q2, Q3), B);
const DQ = 0.75, RQ = 1.5, HQ = Math.sqrt(RQ * RQ - DQ * DQ);
const eq = (m, u, n) => ({ k1: sub(m, mul(u, DQ)), k2: add(m, mul(u, DQ)), x: add(m, mul(n, HQ)) });
const EQ_INF = eq(M1, P(1, 0), P(0, -1)), EQ_DER = eq(M2, P(0, 1), P(1, 0)), EQ_IZQ = eq(M4, P(0, 1), P(-1, 0));
const EQ_SUP = eq(M3, P(1, 0), P(0, 1)), EQ_H = eq(H, P(0, 1), P(1, 0));
// Demostraciones del compás (fuera del plano)
const C0 = P(9.5, -1.0), A2 = P(8, 0.5), R1 = 0.6;
const T1 = polar(A2, R1, 0), T2 = polar(A2, R1, 60), T3 = polar(A2, R1, 120), T4 = sub(add(T2, T3), A2);
const MM = P(11, 0.5), K1 = P(10.6, 0.5), K2 = P(11.4, 0.5), R2 = 0.7, XX = P(11, 0.5 + Math.sqrt(R2 * R2 - 0.16));

// ------------------------------------------------------------ guion de acciones de cada escena
// at(k, f): instante dentro de la frase k (f = 0 inicio, 1 final), según la duración real de la voz.
const arcTo = (c, target, span = 16) => { const a = ang(c, target); return { c, r: len(sub(target, c)), a0: a - span, a1: a + span }; };
const crew = { cen: 'p2', tip: 'p3' }, solo = { cen: 'p1L', tip: 'p1R' };
function perpEqual(at, m, q, end, name, k0, spans) {
  // spans: [[k,f0,f1] x 7]: cinta 1, cinta 2, arco 1, arco 2, marca 3, cinta al extremo, marca extremo
  const s = spans, T = (i, j) => at(s[i][0], s[i][j]);
  return [
    { k: 'tape', a: m, b: q.k1, t0: T(0, 1), t1: T(0, 2), hold: 0.3, z: 'p2', tip: 'p3' },
    { k: 'mark', p: q.k1, label: '1', t: T(0, 2), aux: true },
    { k: 'tape', a: m, b: q.k2, t0: T(1, 1), t1: T(1, 2), hold: 0.3, z: 'p2', tip: 'p3' },
    { k: 'mark', p: q.k2, label: '2', t: T(1, 2), aux: true },
    { k: 'arc', ...arcTo(q.k1, q.x, 20), t0: T(2, 1), t1: T(2, 2), ...crew, aux: true },
    { k: 'arc', ...arcTo(q.k2, q.x, 20), t0: T(3, 1), t1: T(3, 2), ...crew, aux: true },
    { k: 'mark', p: q.x, label: '3', t: T(4, 1), aux: true },
    { k: 'tape', a: m, b: end, t0: T(5, 1), t1: T(5, 2), hold: 0.5, z: 'p2', tip: 'p3' },
    { k: 'mark', p: end, label: name, t: T(6, 1) },
  ];
}
const semiAct = (s, t0, t1) => ({ k: 'semi', c: s.c, r: s.r, a0: s.a0, a1: s.a1, t0, t1, ...crew });
const lineAct = (a, b, t0, t1, silent) => ({ k: 'line', a, b, t0, t1, ea: silent ? null : 'p2', eb: silent ? null : 'p3' });

const DEFS = {
  inicio: at => ({
    cam: [1.25, -4.7, 1.45, 1.25, -1.35, 0.55],
    idle: { p1: P(1.25, -1.3), p2: P(0.3, -1.75), p3: P(2.2, -1.75) },
    acts: [{ k: 'wave', who: 'p1', t0: at(0, 0.05), t1: at(0, 0.7) },
           { k: 'wave', who: 'p2', t0: at(1, 0.2), t1: at(1, 0.5) },
           { k: 'wave', who: 'p3', t0: at(1, 0.4), t1: at(1, 0.7) }],
    panel: { tag: 'Inicio', bullets: ['PCia explica cada paso', 'PCia2 sujeta el cero y el centro', 'PCia3 tensa y marca con la tiza', 'Salta a cualquier escena con los botones de arriba'] },
  }),
  compas: at => ({
    cam: [9.3, -3.75, 1.6, 9.2, -1.15, 0.25],
    idle: { p1: P(9.5, -0.55) }, only: ['p1'],
    acts: [{ k: 'show', who: 'p1', t0: at(0, 0.02), t1: at(0, 1.05) },
           { k: 'mark', p: C0, label: 'centro', t: at(1, 0.25), aux: true },
           { k: 'arc', c: C0, r: 0.8, a0: 130, a1: 230, pre: at(1, 0.1), t0: at(2, 0.1), t1: at(2, 0.75), ...solo, aux: false }],
    panel: { tag: 'Compás', bullets: ['Tiza cilíndrica anudada al extremo del cordel', 'Mano izquierda: fija el cordel en el centro', 'Mano derecha: tensa el cordel y marca con la tiza', 'Radio = cordel entre las dos manos'] },
  }),
  esquina: at => ({
    cam: [7.85, -2.0, 2.7, 8.1, 0.75, 0],
    idle: { p1: P(9.75, 1.45) }, only: ['p1'],
    acts: [lineAct(P(7.6, 0.5), P(9.6, 0.5), 0.05, 0.35, true),
           { k: 'mark', p: A2, label: 'A', t: at(0, 0.08) },
           { k: 'arc', c: A2, r: R1, a0: -10, a1: 135, t0: at(0, 0.35), t1: at(0, 0.9), ...solo, aux: true },
           { k: 'mark', p: T1, label: '1', t: at(0, 0.92), aux: true },
           { k: 'arc', ...arcTo(T1, T2), t0: at(1, 0.1), t1: at(1, 0.4), ...solo, aux: true },
           { k: 'mark', p: T2, label: '2', t: at(1, 0.42), aux: true },
           { k: 'arc', ...arcTo(T2, T3), t0: at(1, 0.55), t1: at(1, 0.88), ...solo, aux: true },
           { k: 'mark', p: T3, label: '3', t: at(1, 0.9), aux: true },
           { k: 'arc', ...arcTo(T2, T4), t0: at(2, 0.05), t1: at(2, 0.4), ...solo, aux: true },
           { k: 'arc', ...arcTo(T3, T4), t0: at(2, 0.5), t1: at(2, 0.85), ...solo, aux: true },
           { k: 'mark', p: T4, label: '4', t: at(2, 0.88), aux: true },
           { k: 'cline', c: A2, a: 90, r0: 0.1, r1: 1.3, t0: at(3, 0.1), t1: at(3, 0.6), ...solo },
           { k: 'text', p: add(A2, P(0.24, 0.26)), text: '90°', t: at(3, 0.7), color: '#5ce39a' }],
    panel: { tag: 'Compás', formula: 'Saltos de 60°: el 4 queda a 90°', bullets: ['Arco con centro en A → punto 1', 'Centro en 1 → punto 2; centro en 2 → punto 3', 'Arcos desde 2 y 3 → punto 4', 'Recta de A por el 4: ángulo recto'] },
  }),
  medio: at => ({
    cam: [10.7, -2.0, 2.7, 10.9, 0.75, 0],
    idle: { p1: P(12.25, 1.35) }, only: ['p1'],
    acts: [lineAct(P(10.1, 0.5), P(11.9, 0.5), 0.05, 0.35, true),
           { k: 'mark', p: MM, label: 'M', t: at(0, 0.12) },
           { k: 'mark', p: K1, label: '1', t: at(0, 0.55), aux: true },
           { k: 'mark', p: K2, label: '2', t: at(0, 0.75), aux: true },
           { k: 'arc', ...arcTo(K1, XX), t0: at(1, 0.05), t1: at(1, 0.4), ...solo, aux: true },
           { k: 'arc', ...arcTo(K2, XX), t0: at(1, 0.5), t1: at(1, 0.85), ...solo, aux: true },
           { k: 'mark', p: XX, label: '3', t: at(1, 0.9), aux: true },
           { k: 'cline', c: MM, a: 90, r0: 0.08, r1: 1.0, t0: at(2, 0.1), t1: at(2, 0.7), ...solo }],
    panel: { tag: 'Compás', formula: 'Arcos iguales → cruce en la perpendicular', bullets: ['Dos puntos a la misma distancia de M', 'Mismo radio desde cada punto', 'Unir M con el cruce'] },
  }),
  plano: at => ({
    cam: [0.7, -2.6, 10.8, 0.7, 1.55, 0], overlay: true,
    idle: { p1: P(-2.9, -1.9), p2: P(4.9, -1.5), p3: P(5.5, -0.8) },
    acts: [],
    panel: { tag: 'El plano', bullets: ['Rectángulo ABCD: 2,50 × 3,50 m', 'Trazos perpendiculares desde los puntos medios: 2,00 m (arriba 2,50 m)', '4 triángulos rectángulos', '4 semicírculos: R 1,00 · 1,33 · 1,33 · 1,18'], hl: { segs: 'all' } },
  }),
  paso1: at => ({
    cam: [1.25, -3.7, 3.2, 1.25, 0.3, 0], plan: true,
    idle: { p1: P(-1.4, 1.2), p2: P(-0.5, -0.8), p3: P(3.2, -0.8) },
    acts: [{ k: 'mark', p: A, label: 'A', t: at(0, 0.05) },
           { k: 'tape', a: A, b: B, t0: at(0, 0.35), t1: at(0, 0.85), hold: 0.6, z: 'p2', tip: 'p3' },
           { k: 'mark', p: B, label: 'B', t: at(0, 0.87) },
           lineAct(A, B, at(1, 0.1), at(1, 0.4))],
    panel: { tag: 'Paso 1 / 9', bullets: ['Cruz de tiza en A', 'Cero de la cinta en el centro de la cruz', 'Marca B a 2,50 m', 'Traza AB en blanco con el cordel'], hl: { pts: ['A', 'B'], segs: [['A', 'B']] } },
  }),

function asphaltTexture() {
  const c = document.createElement('canvas'); c.width = c.height = 512;
  const g = c.getContext('2d'), img = g.createImageData(512, 512);
  for (let i = 0; i < img.data.length; i += 4) {
    const v = 58 + Math.random() * 34 + (Math.random() > 0.985 ? 55 : 0);
    img.data[i] = v; img.data[i + 1] = v; img.data[i + 2] = v + 3; img.data[i + 3] = 255;
  }
  g.putImageData(img, 0, 0);
  const t = new THREE.CanvasTexture(c);
  t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(30, 30); t.colorSpace = THREE.SRGBColorSpace;
  return t;
}

function ribbon(points, width, material, h = 0.004) {
  const pos = [], idx = [];
  for (let i = 0; i < points.length; i++) {
    const a = points[Math.max(0, i - 1)], b = points[Math.min(points.length - 1, i + 1)];
    const t = nrm(sub(b, a)), n = P(-t.y, t.x), p = points[i];
    const l = add(p, mul(n, width / 2)), r = sub(p, mul(n, width / 2));
    pos.push(l.x, h, -l.y, r.x, h, -r.y);
    if (i > 0) { const j = i * 2; idx.push(j - 2, j - 1, j, j - 1, j + 1, j); }
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  g.setIndex(idx);
  const m = new THREE.Mesh(g, material);
  m.userData.segs = points.length - 1;
  m.visible = false;
  scene.add(m);
  return m;
}
const setRibbon = (m, p) => { m.visible = p > 0; m.geometry.setDrawRange(0, Math.ceil(m.userData.segs * clamp01(p)) * 6); };
const arcPoints = (c, r, a0, a1, n = 90) => Array.from({ length: n + 1 }, (_, i) => polar(c, r, a0 + (a1 - a0) * i / n));

function textSprite(text, color = '#f6f5ef', size = 0.24) {
  const c = document.createElement('canvas'), g = c.getContext('2d');
  const font = '700 96px "Atkinson Hyperlegible", system-ui, sans-serif';
  g.font = font;
  const w = Math.ceil(g.measureText(text).width) + 48;
  c.width = w; c.height = 140;
  g.font = font; g.textAlign = 'center'; g.textBaseline = 'middle';
  g.fillStyle = 'rgba(12,14,16,0.72)';
  const r = 30; g.beginPath(); g.roundRect(4, 10, w - 8, 120, r); g.fill();
  g.fillStyle = color; g.fillText(text, w / 2, 74);
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace;
  const s = new THREE.Sprite(new THREE.SpriteMaterial({ map: t, depthWrite: false, transparent: true }));
  s.scale.set(size * w / 140, size, 1);
  s.renderOrder = 10;
  s.visible = false;
  scene.add(s);
  return s;
}

function crossMark(p, aux) {
  const g = new THREE.Group(), s = aux ? 0.11 : 0.17, m = aux ? MAT.auxMark : MAT.chalk;
  for (const a of [45, -45]) {
    const b = new THREE.Mesh(new THREE.BoxGeometry(s, 0.004, aux ? 0.014 : 0.022), m);
    b.rotation.y = a * Math.PI / 180; g.add(b);
  }
  g.position.copy(W(p, 0.003)); g.visible = false; scene.add(g);
  return g;
}

function placeBetween(mesh, a, b, axis = 'y') {
  const d = new THREE.Vector3().subVectors(b, a), l = d.length();
  mesh.position.copy(a).addScaledVector(d, 0.5);
  if (axis === 'y') { mesh.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), d.normalize()); mesh.scale.set(1, Math.max(l, 1e-4), 1); }
  else { mesh.quaternion.setFromUnitVectors(new THREE.Vector3(1, 0, 0), d.normalize()); mesh.scale.set(Math.max(l, 1e-4), 1, 1); }
}

function planShapes() {

  const mats = [];

    const s = new THREE.Shape(pts.map(p => new THREE.Vector2(p.x, p.y)));
    const m = new THREE.MeshBasicMaterial({ color, transparent: true, opacity: 0, depthWrite: false });
    const mesh = new THREE.Mesh(new THREE.ShapeGeometry(s, 48), m);
    mesh.rotation.x = -Math.PI / 2; mesh.position.y = h; grp.add(mesh); mats.push(m);

  shape([G, H, I], '#c47854', 0.0016);
  Object.values(SEMIS).forEach(sm => shape(arcPoints(sm.c, sm.r, sm.a0, sm.a1, 60), '#fdf578', 0.0015));

}

const S = { i: 0, t: 0, playing: false, voice: true, auto: true, started: false, camTween: null, userCam: false };
const audios = [];
function audioFor(i) { if (!audios[i]) { audios[i] = new Audio(SCENES[i].audio); audios[i].preload = 'auto'; } return audios[i]; }

// ¿Cuánto se ve de cada acción en la escena actual?  -1 = oculto
function progressOf(a, t) {
  const cur = S.i, here = a.scene === cur;
  const persistent = !a.aux && ['mark', 'line', 'semi'].includes(a.k);
  if (!here) return (RUN[cur].plan && RUN[a.scene].plan && a.scene < cur && persistent) ? 1 : -1;
  if (a.k === 'mark' || a.k === 'text') return t >= a.t ? ease((t - a.t) / 0.3) : -1;
  if (t < a.t0) return -1;
  return ease((t - a.t0) / (a.t1 - a.t0));
}

function robotHome(id, def) { return def.idle[id] || P(0, -3); }
function faceYaw(from, to) { return Math.atan2(to.x - from.x, -(to.y - from.y)); }

function desiredPoses(t) {
  const run = RUN[S.i], def = run.def, camP = P(camera.position.x, -camera.position.z);
  const want = {};
  for (const id of ['p1', 'p2', 'p3']) {
    const home = robotHome(id, def);
    want[id] = { pos: home, yaw: faceYaw(home, camP), L: null, R: null, poseL: 'rest', poseR: 'rest', chalk: false, lift: 0 };
  }
  const tools = { tape: null, cord: null, chalkAt: null, loopAt: null };
  let focus = null;
  for (const a of run.acts) {
    const start = a.pre ?? (a.t0 ?? a.t) - 1.3, end = (a.t1 ?? a.t) + (a.hold ?? 0.6);
    if (a.t0 !== undefined && t >= a.t0) focus = a.k === 'tape' ? a.b : (a.k === 'line' ? a.b : (a.k === 'cline' ? polar(a.c, a.r1, a.a) : a.c));
    if (a.k === 'mark' && t >= a.t) focus = a.p;
    if (t < start || t > end) continue;
    const p = a.t0 !== undefined ? ease((t - a.t0) / (a.t1 - a.t0)) : 0;
    if (a.k === 'wave' && t >= a.t0 && t <= a.t1) { want[a.who].poseR = 'wave'; want[a.who].wave = true; }
    if (a.k === 'show' && t >= a.t0 && t <= a.t1) { want[a.who].show = true; }
    if (a.k === 'tape') {
      const tip = add(a.a, mul(sub(a.b, a.a), p));
      const u = nrm(sub(a.b, a.a));
      holdAt(want[a.z], a.a, a.b, 'R', 'press');
      holdAt(want[a.tip], tip, sub(tip, u), 'R', 'grip');

    }
    if (a.k === 'arc' || a.k === 'semi' || a.k === 'cline') {
      const tipAt = a.k === 'cline' ? polar(a.c, a.r0 + (a.r1 - a.r0) * p, a.a) : polar(a.c, a.r, a.a0 + (a.a1 - a.a0) * p);
      if (a.cen === 'p1L') compassSolo(want.p1, a.c, tipAt);
      else { holdAt(want[a.cen], a.c, tipAt, 'R', 'press'); holdAt(want[a.tip], tipAt, a.c, 'R', 'grip'); want[a.tip].chalk = true; }
      tools.cord = { a: a.c, b: tipAt };

      holdAt(want[a.ea], a.a, a.b, 'R', 'press'); holdAt(want[a.eb], a.b, a.a, 'R', 'press');
      if (t < a.t0 + (a.t1 - a.t0) * 0.5) tools.cord = { a: a.a, b: a.b, noChalk: true };

}
function holdAt(w, point, other, side, pose) {

function applyRobots(dt, t, want) {
  const k = 1 - Math.exp(-dt * 6), kh = 1 - Math.exp(-dt * 12);
  for (const [id, r] of Object.entries(ROB)) {
    const w = want[id];
    const target = new THREE.Vector3(w.pos.x, 0.09 + 0.018 * Math.sin(t * 2.2 + r.phase), -w.pos.y);
    r.pos.lerp(target, k);
    let dy = w.yaw - r.yaw; dy = Math.atan2(Math.sin(dy), Math.cos(dy)); r.yaw += dy * k;
    const shown = !RUN[S.i].def.only || RUN[S.i].def.only.includes(id);
    r.g.visible = shown; for (const s of ['L', 'R']) { r.arms[s].pod.visible = r.arms[s].ring.visible = r.arms[s].hand.visible = shown; }
    if (!shown) { r.chalk = false; continue; }
    r.g.position.copy(r.pos); r.g.rotation.y = r.yaw;
    r.head.rotation.z = 0.05 * Math.sin(t * 1.3 + r.phase);
    // el frente del robot es +Z local, así que su derecha es -X local
    const right = new THREE.Vector3(-Math.cos(r.yaw), 0, Math.sin(r.yaw)), fwd = new THREE.Vector3(Math.sin(r.yaw), 0, Math.cos(r.yaw));
    for (const side of ['L', 'R']) {
      const sx = side === 'L' ? -1 : 1, arm = r.arms[side];
      const shoulder = r.pos.clone().addScaledVector(right, sx * 0.3).add(new THREE.Vector3(0, 0.5, 0));
      let hand;
      if (w[side]) hand = W(w[side], w[side + 'h'] ?? 0.06);
      else if (side === 'R' && w.wave) hand = shoulder.clone().addScaledVector(right, 0.08).add(new THREE.Vector3(0, 0.32, 0)).addScaledVector(right, 0.06 * Math.sin(t * 9));
      else if (w.show) hand = r.pos.clone().addScaledVector(fwd, 0.36).addScaledVector(right, side === 'R' ? 0.1 : -0.1).add(new THREE.Vector3(0, side === 'R' ? 0.66 : 0.52, 0));
      else hand = shoulder.clone().addScaledVector(fwd, 0.1).add(new THREE.Vector3(0, -0.28, 0));
      arm.pos.lerp(hand, kh);
      const toShoulder = new THREE.Vector3().subVectors(shoulder, arm.pos);
      const dist = toShoulder.length(); toShoulder.normalize();
      const podPos = arm.pos.clone().addScaledVector(toShoulder, Math.min(0.2, dist * 0.6));
      arm.pod.position.copy(podPos);
      arm.pod.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), toShoulder);
      arm.ring.position.copy(arm.pos).addScaledVector(toShoulder, 0.05);
      arm.ring.quaternion.setFromUnitVectors(new THREE.Vector3(0, 0, 1), toShoulder);
      arm.hand.position.copy(arm.pos);
      arm.hand.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), toShoulder);
      const pose = side === 'L' ? (w.show ? 'grip' : w.poseL) : (w.show ? 'grip' : w.poseR);
      setHandPose(arm.hand, pose);
    }
    r.chalk = w.chalk || w.show;
  }
}

function applyTools(tools, want) {

function applyDrawings(t) {
  const run = RUN[S.i];
  for (const r of RUN) for (const a of r.acts) {
    const p = progressOf(a, t);
    if (a.k === 'arc' || a.k === 'semi' || a.k === 'line' || a.k === 'cline') setRibbon(a.obj, p < 0 ? 0 : p);
    if (a.k === 'mark') {
      a.obj.visible = p >= 0; a.lab.visible = p >= 0;
      if (p >= 0) { const s = 0.2 + 0.8 * p; a.obj.scale.set(s, 1, s); }
    }
    if (a.k === 'text') a.lab.visible = p >= 0;
  }
  const ov = run.def.overlay, fl = run.def.fills;
  OVER.grp.visible = !!ov; FILL.grp.visible = !!fl;
  if (ov) { const k = ease(t / 1.2); OVER.mats.forEach(m => m.opacity = 0.85 * k); }
  if (fl) { const k = ease((t - 0.5) / 1.5); FILL.mats.forEach(m => m.opacity = 0.42 * k); }

}

function updateStrip() {
  SCENES.forEach((s, i) => { s.chip.classList.toggle('on', i === S.i); s.chip.classList.toggle('done', i < S.i); s.chip.setAttribute('aria-current', i === S.i ? 'step' : 'false'); });
  SCENES[S.i].chip.scrollIntoView({ block: 'nearest', inline: 'center', behavior: 'smooth' });
}
function updateCard() {
  const run = RUN[S.i], pnl = run.def.panel;
  $('tag').textContent = pnl.tag; $('ttl').textContent = run.data.title;
  $('bul').innerHTML = pnl.bullets.map(b => `<li>${b}</li>`).join('');
  $('fml').hidden = !pnl.formula; $('fml').textContent = pnl.formula || '';
  const showMini = !!pnl.hl; $('mini').hidden = !showMini; if (showMini) drawMini(pnl.hl);
}
function fmtT(s) { s = Math.max(0, s); return `${Math.floor(s / 60)}:${String(Math.floor(s % 60)).padStart(2, '0')}`; }
function updateBar() {
  const d = SCENES[S.i].dur; $('fill').style.width = `${100 * clamp01(S.t / d)}%`;
  $('time').textContent = `${fmtT(S.t)} / ${fmtT(d)}`;
  const cap = [...SCENES[S.i].caps].reverse().find(c => S.t >= c.t - 0.1);
  const txt = cap && S.t <= cap.t + cap.d + 0.8 ? cap.text : '';
  if ($('sub').textContent !== txt) $('sub').innerHTML = txt.replace(/PCia\d?/g, m => `<span class="who">${m}</span>`);
}
function setPlayIcon() { $('playIcon').innerHTML = S.playing ? '<path d="M6 4h4v16H6zm8 0h4v16h-4z"/>' : '<path d="M7 4v16l13-8z"/>'; }
function stopAudio() { audios.forEach(a => a && a.pause()); }
function play() {
  S.playing = true; setPlayIcon();
  if (S.voice) { const a = audioFor(S.i); a.currentTime = Math.min(S.t, a.duration || S.t); a.play().catch(() => {}); }
}
function pause() { S.playing = false; setPlayIcon(); stopAudio(); }
function goTo(i, autoplay) {
  if (i < 0 || i >= SCENES.length) return;
  stopAudio(); S.i = i; S.t = 0; S.userCam = false;
  flyCamera(i); updateStrip(); updateCard(); updateBar();
  try { history.replaceState(null, '', '#' + SCENES[i].id); } catch (e) {}
  if (autoplay || S.playing) play();
}
function seek(frac) { S.t = clamp01(frac) * SCENES[S.i].dur; if (S.playing) play(); updateBar(); }

$('go').addEventListener('click', () => { $('start').hidden = true; S.started = true; goTo(S.i, true); });
$('play').addEventListener('click', () => { if (!S.started) { $('go').click(); return; } S.playing ? pause() : (S.t >= SCENES[S.i].dur ? (S.t = 0, play()) : play()); });
$('prev').addEventListener('click', () => goTo(S.i - 1, S.started));
$('next').addEventListener('click', () => goTo(S.i + 1, S.started));
$('again').addEventListener('click', () => { S.t = 0; flyCamera(S.i); S.userCam = false; if (S.started) play(); });
$('view').addEventListener('click', () => { flyCamera(S.i); S.userCam = false; });
$('voice').addEventListener('click', () => { S.voice = !S.voice; $('voice').setAttribute('aria-pressed', S.voice); stopAudio(); if (S.playing && S.voice) play(); });
$('auto').addEventListener('click', () => { S.auto = !S.auto; $('auto').setAttribute('aria-pressed', S.auto); });
$('cardToggle').addEventListener('click', () => { const c = $('card'); c.classList.toggle('min'); $('cardToggle').textContent = c.classList.contains('min') ? '+' : '–'; });
const bar = $('bar');
bar.addEventListener('click', e => { const r = bar.getBoundingClientRect(); seek((e.clientX - r.left) / r.width); });
bar.addEventListener('keydown', e => { if (e.key === 'ArrowRight') seek((S.t + 3) / SCENES[S.i].dur); if (e.key === 'ArrowLeft') seek((S.t - 3) / SCENES[S.i].dur); });
window.addEventListener('keydown', e => {
  if (e.target.closest && e.target.closest('.bar')) return;
  if (e.key === ' ' && e.target === document.body) { e.preventDefault(); $('play').click(); }
  if (e.key === 'PageDown') goTo(S.i + 1, S.started);
  if (e.key === 'PageUp') goTo(S.i - 1, S.started);
});

// ------------------------------------------------------------ bucle
function resize() {
  const st = $('stage'), w = st.clientWidth, h = st.clientHeight;
  renderer.setSize(w, h, false); camera.aspect = w / Math.max(h, 1); camera.updateProjectionMatrix();
}
window.addEventListener('resize', resize);
let last = performance.now();
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  if (S.playing) {
    const a = audios[S.i];
    if (S.voice && a && !a.paused && !a.ended && a.currentTime > 0) S.t = a.currentTime; else S.t += dt;
    if (S.t >= SCENES[S.i].dur) {
      S.t = SCENES[S.i].dur;
      if (S.auto && S.i < SCENES.length - 1) goTo(S.i + 1, true); else pause();
    }
    updateBar();
  }
  const { want, tools } = desiredPoses(S.t);
  applyRobots(dt, performance.now() / 1000, want);
  applyTools(tools, want);
  applyDrawings(S.t);
  if (S.camTween) {
    const tw = S.camTween; tw.t += dt / 1.6; const k = ease(tw.t);
    camera.position.lerpVectors(tw.from.pos, tw.to.pos, k); controls.target.lerpVectors(tw.from.tgt, tw.to.tgt, k);
    if (tw.t >= 1) S.camTween = null;
  }
  controls.update();
  renderer.render(scene, camera);
  requestAnimationFrame(frame);
}

if (!SCENES) {
  $('start').querySelector('p').textContent = 'Faltan los datos de las escenas: genera la página con construir.py.';
} else {
  const init = () => {
    buildScenes(); buildStrip();
    const fromHash = SCENES.findIndex(s => '#' + s.id === location.hash);
    S.i = fromHash >= 0 ? fromHash : 0;
    resize(); flyCamera(S.i, true); updateStrip(); updateCard(); updateBar();
    requestAnimationFrame(frame);
    // acceso directo: PCia.ir('paso3', 12) abre la escena en el segundo indicado (pausada)
    window.PCia = { ir(id, t = 0) { const i = SCENES.findIndex(s => s.id === id); if (i < 0) return; $('start').hidden = true; S.started = true; pause(); goTo(i, false); S.t = t; flyCamera(i, true); updateBar(); } };
  };
  // espera a las fuentes para que los rótulos 3D salgan con la tipografía correcta
  Promise.race([document.fonts.ready, new Promise(r => setTimeout(r, 1500))]).then(init);
}
</script>
