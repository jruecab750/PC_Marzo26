<title>GALía replantea el plano 1</title>

<style>
:root {
  color-scheme: dark;
  --bg: #15181b;
  --panel: rgba(24, 28, 32, 0.86);
  --panel-solid: #1c2125;
  --line: #2f363c;
  --ink: #f4f2ee;
  --muted: #a3acb5;
  --orange: #ff6b1a;
  --orange-deep: #d9500a;
  --cyan: #3fd4ff;
  --tape: #f2c230;
  --ok: #5ce39a;
  --display: "Barlow Condensed", "Arial Narrow", "Roboto Condensed", sans-serif;
  --body: "Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
  --mono: "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
html, body { height: 100%; }
[hidden] { display: none !important; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 15px; overflow: hidden; }
#app { height: 100%; display: flex; flex-direction: column; }
button { font: inherit; color: inherit; }
button:focus-visible, [tabindex]:focus-visible { outline: 2px solid var(--cyan); outline-offset: 2px; }

/* Barra superior: marca + selector de escenas */
.top { position: relative; z-index: 3; display: flex; align-items: center; gap: 14px; padding: 8px 16px; background: var(--panel-solid); border-bottom: 1px solid var(--line); min-width: 0; }
.brand { display: flex; align-items: baseline; gap: 8px; flex: none; }
.brand b { font-family: var(--display); font-size: 24px; letter-spacing: 0.02em; color: var(--orange); line-height: 1; }
.brand span { font-family: var(--display); font-size: 17px; color: var(--muted); letter-spacing: 0.04em; text-transform: uppercase; white-space: nowrap; }
.strip { display: flex; gap: 14px; overflow-x: auto; scrollbar-width: thin; min-width: 0; flex: 1; padding-bottom: 2px; }
.grp { display: flex; align-items: center; gap: 5px; flex: none; }
.grp > i { font-style: normal; font-family: var(--display); font-size: 13px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); margin-right: 2px; }
.chip { border: 1px solid var(--line); background: transparent; border-radius: 6px; padding: 5px 9px; cursor: pointer; font-family: var(--display); font-size: 16px; letter-spacing: 0.02em; white-space: nowrap; color: var(--ink); }
.chip:hover { border-color: var(--muted); }
.chip.done { color: var(--muted); }
.chip.on { background: var(--orange); border-color: var(--orange); color: #1a0d04; }
.chip.menu::after { content: " ▾"; }
.chip.menu.part { border-color: var(--orange); color: var(--orange); }
.pop { position: fixed; z-index: 20; display: flex; flex-direction: column; gap: 4px; padding: 6px; background: var(--panel-solid); border: 1px solid var(--line); border-radius: 8px; box-shadow: 0 8px 24px rgba(0, 0, 0, 0.45); }
.pop .chip { text-align: left; }

/* Escenario */
.stage { position: relative; flex: 1; min-height: 0; overflow: hidden; }
#gl { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
.card { position: absolute; top: 12px; left: 12px; width: min(330px, calc(100% - 24px)); background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; backdrop-filter: blur(6px); display: flex; flex-direction: column; gap: 8px; max-height: calc(100% - 24px); overflow-y: auto; box-sizing: border-box; }
.card .tag { font-family: var(--display); font-size: 14px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--orange); }
.card h1 { margin: 0; font-family: var(--display); font-weight: 700; font-size: 26px; line-height: 1.05; text-wrap: balance; }
.card ul { margin: 0; padding-left: 18px; display: flex; flex-direction: column; gap: 3px; line-height: 1.35; }
.card li::marker { color: var(--tape); }
.card .formula { font-family: var(--mono); font-size: 13px; color: var(--tape); border: 1px solid rgba(242, 194, 48, 0.45); border-radius: 6px; padding: 6px 8px; }
.card canvas { align-self: center; width: 150px; height: 150px; }
.card .toggle { position: absolute; top: 8px; right: 8px; border: 0; background: transparent; cursor: pointer; color: var(--muted); font-size: 18px; line-height: 1; padding: 4px; }
.card.min { width: auto; padding: 8px 40px 8px 12px; }
.card.min > :not(.tag):not(.toggle) { display: none; }
.sub { position: absolute; left: 50%; bottom: 14px; transform: translateX(-50%); width: min(900px, calc(100% - 32px)); text-align: center; font-size: clamp(16px, 2.1vw, 22px); line-height: 1.35; background: rgba(10, 12, 14, 0.78); border-radius: 8px; padding: 8px 14px; text-wrap: balance; }
.sub:empty { display: none; }
.who { color: var(--orange); font-weight: 700; }

/* Portada */
.start { position: absolute; inset: 0; display: grid; place-items: center; background: radial-gradient(ellipse at 50% 40%, rgba(21, 24, 27, 0.35), rgba(21, 24, 27, 0.88)); }
.start > div { text-align: center; display: flex; flex-direction: column; gap: 12px; align-items: center; padding: 0 16px; }
.start h2 { margin: 0; font-family: var(--display); font-size: clamp(40px, 7vw, 72px); line-height: 0.95; letter-spacing: 0.01em; }
.start h2 em { font-style: normal; color: var(--orange); }
.start p { margin: 0; color: var(--muted); max-width: 46ch; line-height: 1.45; }
.go { border: 0; background: var(--orange); color: #1a0d04; font-family: var(--display); font-weight: 700; font-size: 24px; letter-spacing: 0.04em; border-radius: 8px; padding: 10px 28px; cursor: pointer; }
.go:hover { background: #ff8340; }

/* Controles */
.ctl { position: relative; z-index: 3; display: flex; align-items: center; gap: 8px; padding: 8px 16px calc(8px + env(safe-area-inset-bottom, 0px)); background: var(--panel-solid); border-top: 1px solid var(--line); flex-wrap: wrap; }
.btn { border: 1px solid var(--line); background: transparent; border-radius: 6px; min-width: 38px; height: 36px; padding: 0 10px; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 6px; }
.btn:hover { border-color: var(--muted); }
.btn.main { background: var(--ink); color: var(--bg); border-color: var(--ink); min-width: 46px; }
.btn[aria-pressed="false"] { color: var(--muted); }
.bar { flex: 1; min-width: 120px; height: 36px; display: flex; align-items: center; cursor: pointer; }
.bar > div { position: relative; height: 6px; width: 100%; background: var(--line); border-radius: 3px; }
.bar b { position: absolute; left: 0; top: 0; bottom: 0; background: var(--orange); border-radius: 3px; }
.bar s { position: absolute; top: -3px; width: 2px; height: 12px; background: rgba(244, 242, 238, 0.35); text-decoration: none; }
.time { font-family: var(--mono); font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; min-width: 86px; text-align: right; }
.btn svg { width: 18px; height: 18px; fill: currentColor; }
.btn .lbl { font-size: 13px; }
@media (max-width: 720px) {
  .brand span { display: none; }
  .card { top: 8px; left: 8px; }
  .card canvas { width: 110px; height: 110px; }
  .card h1 { font-size: 21px; }
  .btn .lbl { display: none; }
  .time { display: none; }
  .top { padding: 6px 8px; gap: 8px; }
  .brand b { font-size: 21px; }
  .strip { gap: 10px; }
  .chip { font-size: 15px; padding: 4px 8px; }
  .ctl { flex-wrap: nowrap; gap: 4px; padding: 6px 8px calc(6px + env(safe-area-inset-bottom, 0px)); }
  .btn { min-width: 32px; height: 32px; padding: 0 6px; }
  .btn.main { min-width: 38px; }
  .bar { min-width: 40px; height: 32px; }
  .sub { bottom: 6px; width: calc(100% - 16px); box-sizing: border-box; font-size: 14px; padding: 5px 8px; }
  .card { max-height: calc(100% - 16px); padding: 10px 12px; }
  .start p { font-size: 13px; }
  .go { font-size: 20px; padding: 8px 22px; }
}
@media (max-width: 420px) { #auto { display: none; } }
@media (max-height: 520px) {
  .sub { font-size: 14px; bottom: 6px; padding: 5px 8px; }
  .card canvas { display: none; }
  .start h2 { font-size: 34px; }
  .start p { display: none; }
}
@media (max-height: 320px) { .sub { font-size: 12.5px; line-height: 1.25; padding: 4px 8px; } }
@media (prefers-reduced-motion: reduce) { .chip, .btn { transition: none; } }

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const SCENES = /*__DATOS__*/null;
const PLAN_ID = /*__PLAN__*/'p1';  // 'p1' o 'p2': qué plano replantea esta página
const PAGE = '<!doctype html>\n' + document.documentElement.outerHTML;

// ------------------------------------------------------------ geometría (coordenadas del plano, metros)
const P = (x, y) => ({ x, y });
const add = (a, b) => P(a.x + b.x, a.y + b.y);
const sub = (a, b) => P(a.x - b.x, a.y - b.y);
const mul = (a, k) => P(a.x * k, a.y * k);
const len = a => Math.hypot(a.x, a.y);
const nrm = a => { const l = len(a) || 1; return P(a.x / l, a.y / l); };
const mid = (a, b) => P((a.x + b.x) / 2, (a.y + b.y) / 2);
const lerpP = (a, b, t) => P(a.x + (b.x - a.x) * t, a.y + (b.y - a.y) * t);
const dir = deg => P(Math.cos(deg * Math.PI / 180), Math.sin(deg * Math.PI / 180));
const polar = (c, r, deg) => add(c, mul(dir(deg), r));
const ang = (c, p) => Math.atan2(p.y - c.y, p.x - c.x) * 180 / Math.PI;
const W = (p, h = 0) => new THREE.Vector3(p.x, h, -p.y);  // plano (x, y) -> mundo (x, altura, -y)
const clamp01 = x => Math.max(0, Math.min(1, x));
const ease = x => { x = clamp01(x); return x * x * (3 - 2 * x); };
const fmtM = v => v.toFixed(2).replace('.', ',') + ' m';

// Plano 1
const A = P(0, 0), B = P(2.5, 0), C = P(2.5, 3.5), D = P(0, 3.5);
const M1 = P(1.25, 0), M2 = P(2.5, 1.75), M3 = P(1.25, 3.5), M4 = P(0, 1.75);
const E = P(1.25, -2), F = P(4.5, 1.75), G = P(1.25, 6), J = P(-2, 1.75), H = P(1.25, 4.75), I = P(3.25, 4.75);
function semicircle(p, q, inner) {
  const c = mid(p, q), r = len(sub(p, q)) / 2, a0 = ang(c, p);
  const plus = polar(c, r, a0 + 90), minus = polar(c, r, a0 - 90);
  return { c, r, a0, a1: len(sub(plus, inner)) < len(sub(minus, inner)) ? a0 - 180 : a0 + 180 };
}
const S_INF = semicircle(E, M1, B), S_DER = semicircle(F, B, M2), S_IZQ = semicircle(J, D, M4), S_SUP = semicircle(G, I, H);
const RX = 1.5;  // radio de la perpendicular en el extremo
const P1 = polar(A, RX, 0), P2 = polar(A, RX, 60), P3 = polar(A, RX, 120), P4 = sub(add(P2, P3), A);
const Q1 = polar(B, RX, 180), Q2 = polar(B, RX, 120), Q3 = polar(B, RX, 60), Q4 = sub(add(Q2, Q3), B);
const DQ = 0.75, RQ = 1.5, HQ = Math.sqrt(RQ * RQ - DQ * DQ);
const eq = (m, u, n) => ({ k1: sub(m, mul(u, DQ)), k2: add(m, mul(u, DQ)), x: add(m, mul(n, HQ)) });
const EQ_INF = eq(M1, P(1, 0), P(0, -1)), EQ_DER = eq(M2, P(0, 1), P(1, 0)), EQ_IZQ = eq(M4, P(0, 1), P(-1, 0));
const EQ_SUP = eq(M3, P(1, 0), P(0, 1));
// Demostraciones del compás (fuera del plano)
const C0 = P(9.5, -1.0), A2 = P(8, 0.5), R1 = 0.6;
const T1 = polar(A2, R1, 0), T2 = polar(A2, R1, 60), T3 = polar(A2, R1, 120), T4 = sub(add(T2, T3), A2);
const MM = P(11, 0.5), K1 = P(10.6, 0.5), K2 = P(11.4, 0.5), R2 = 0.7, XX = P(11, 0.5 + Math.sqrt(R2 * R2 - 0.16));
// Método 3 (terna 1,5 - 2 - 2,5 m)
const A3 = P(13.5, 0.5), K3 = P(15.0, 0.5), X3 = P(13.5, 2.5);
// Perpendicular por el punto medio desconocido (segmento A-B de 1,60 m, radio 1,10 m)
const SA = P(16.9, 1.0), SB = P(18.5, 1.0), RM = 1.1, HM = Math.sqrt(RM * RM - 0.64);
const XU = P(17.7, 1.0 + HM), XD = P(17.7, 1.0 - HM), MS = P(17.7, 1.0);
// Cordel atirantado
const L1 = P(20.3, 0.4), L2 = P(23.3, 0.4);
// Pitágoras: catetos de 3 y 4 cuadraditos de 0,5 m
const PR = P(27, 0.2), PP = P(28.5, 0.2), PQ = P(27, 2.2);
// Zona de trabajo asignada (9 × 10,5 m) y caja del dibujo completo (7,16 × 8,55 m)
const ZX0 = -3.25, ZX1 = 5.75, ZY0 = -2.98, ZY1 = 7.52;
const BX0 = -2.329, BX1 = 4.829, BY0 = -2.0, BY1 = 6.554;
function midInfo(p, q, r) {
  const m = mid(p, q), u = nrm(sub(q, p)), n = P(-u.y, u.x), h = Math.sqrt(r * r - (len(sub(q, p)) / 2) ** 2);
  return { m, x1: add(m, mul(n, h)), x2: sub(m, mul(n, h)) };
}

// Plano 2: cuadrado de 3 × 3 m; de cada punto medio sale un trazo con un triángulo rectángulo
const GEO2 = (() => {
  const pts = { A: P(0, 0), B: P(3, 0), C: P(3, 3), D: P(0, 3), M1: P(1.5, 0), M2: P(3, 1.5), M3: P(1.5, 3), M4: P(0, 1.5),
    E: P(1.5, -1.5), F: P(1.5, -3), G: P(3.5, -1.5),      // abajo (amarillo)
    H: P(4, 1.5), I: P(5, 1.5), J: P(4, 3.5),             // derecha (azul)
    K: P(1.5, 4), L: P(1.5, 5), N: P(3.3, 5),             // arriba (rojo)
    P: P(-1.5, 1.5), Q: P(-3, 1.5), R: P(-1.5, -0.5) };   // izquierda (verde)
  const q = pts;
  return {
    pts, semis: {},
    segs: [['A', 'B'], ['B', 'C'], ['C', 'D'], ['D', 'A'], ['M1', 'F'], ['E', 'G'], ['G', 'F'], ['M2', 'I'], ['H', 'J'], ['J', 'I'],
      ['M3', 'L'], ['L', 'N'], ['N', 'K'], ['M4', 'Q'], ['P', 'R'], ['R', 'Q']],
    polys: [[[q.A, q.B, q.C, q.D], '#c8795a'], [[q.E, q.G, q.F], '#fcf577'], [[q.H, q.I, q.J], '#5b86d6'], [[q.L, q.N, q.K], '#ff5a2a'], [[q.P, q.Q, q.R], '#6f9a4f']],
    labels: [['A', -12, 12], ['B', 12, 12], ['C', 12, -10], ['D', -12, -10], ['F', -12, 8], ['G', 13, 0], ['I', 12, 10], ['J', 12, -6], ['L', -12, -6], ['N', 13, -4], ['Q', -10, -12], ['R', -12, 8]],
    mini: { s: 28, cx: 1, cy: 1 },
    dims: [[P(2.3, -0.3), '3,00'], [P(2.55, 2.2), '3,00'], [P(1.15, -2.3), '3,00'], [P(1.15, -0.75), '1,50'], [P(2.5, -1.2), '2,00'],
      [P(4.5, 1.2), '2,00'], [P(3.5, 1.2), '1,00'], [P(3.62, 2.9), '2,00'], [P(-2.25, 1.8), '3,00'], [P(-0.75, 1.8), '1,50'], [P(-1.15, 0.5), '2,00'],
      [P(1.15, 4.5), '2,00'], [P(1.15, 3.5), '1,00'], [P(2.4, 5.3), '1,80']],
    zone: { x0: -4, x1: 6, y0: -4, y1: 6, pillarY: 3.0 },
  };
})();

// ------------------------------------------------------------ guion de acciones de cada escena
// at(k, f): instante dentro de la frase k (f = 0 inicio, 1 final), según la duración real de la voz.
const arcTo = (c, target, span = 16) => { const a = ang(c, target); return { c, r: len(sub(target, c)), a0: a - span, a1: a + span }; };
// Papeles fijos (el alumnado asume uno): GALía2 sujeta el centro o el cero, GALía3 lleva la tiza en los arcos
// y el extremo de la cinta, y GALía dirige y pasa la tiza en las rectas con el cordel atirantado.
const crew = { cen: 'p2', tip: 'p3' }, solo = { cen: 'p1L', tip: 'p1R' };
// arco de radio corto (≈1 m) trazado por un solo robot: una mano en el centro y la otra con la tiza
const soloOf = a => a.solo || (a.cen === 'p1L' ? 'p1' : null);
// Cada construcción auxiliar (una perpendicular, un punto medio…) es un «ejercicio»: EX() le da un
// número para colorearla aparte y desvanecerla cuando llegan los ejercicios siguientes.
let GRP = 0;
const EX = acts => { const g = ++GRP; acts.forEach(a => { if (a.aux) a.grp = g; }); return acts; };
function perpEqual(at, m, q, end, name, k0, spans) {
  // Método 2. spans: [[k,f0,f1] x 7]: marca 1, marca 2, arco 1, arco 2, cruce 3, cinta al extremo, marca del extremo
  const s = spans, T = (i, j) => at(s[i][0], s[i][j]);
  return EX([
    { k: 'arc', ...arcTo(m, q.k1, 22), t0: T(0, 1), t1: T(0, 2), ...crew, aux: true },
    { k: 'mark', p: q.k1, label: '1', t: T(0, 2), aux: true },
    { k: 'arc', ...arcTo(m, q.k2, 22), t0: T(1, 1), t1: T(1, 2), ...crew, aux: true },
    { k: 'mark', p: q.k2, label: '2', t: T(1, 2), aux: true },
    { k: 'arc', ...arcTo(q.k1, q.x, 20), t0: T(2, 1), t1: T(2, 2), ...crew, aux: true },

// Horario realista: si un robot no llega andando a su sitio antes de un trazo, ese trazo (y las marcas
// que dependen de él) se retrasa hasta que llega. Así nunca se dibuja nada sin su robot.
const WALK = 1.6;  // m/s, velocidad media de desplazamiento prevista
function retime(def, sd) {
  // D = retraso acumulado; steps guarda desde qué instante (original) se aplica cada valor de D
  const pos = {}, free = {}, steps = [];
  for (const id of ['p1', 'p2', 'p3']) { pos[id] = robotHome(id, def); free[id] = 0; }
  const Dat = t => { let d = 0; for (const [ot, dd] of steps) if (t >= ot - 1e-6) d = dd; return d; };
  const moving = def.acts.filter(a => a.t0 !== undefined && actRoles(a).length).sort((x, y) => x.t0 - y.t0);
  let D = 0;
  for (const a of moving) {
    const t0o = a.t0, t1o = a.t1, need = { p1: {}, p2: {}, p3: {} };
    if (a.t1end !== undefined) a.t1end += Dat(a.t1end);
    poseAct(a, a.t0, need, {});
    let start = t0o + D;
    // todos los robots de la acción salen juntos cuando queda libre el último de ellos
    const leave0 = Math.max(0, ...actRoles(a).map(id => free[id]));
    for (const id of actRoles(a)) if (need[id].pos) start = Math.max(start, leave0 + len(sub(need[id].pos, pos[id])) / WALK + 0.45);
    if (start > t0o + D) { D = start - t0o; steps.push([t0o, D]); }
    // la tiza no puede ir más deprisa de lo que anda el robot que la lleva
    const path = a.k === 'tape' ? 0 : a.k === 'line' ? len(sub(a.b, a.a)) : a.k === 'cline' ? Math.abs(a.r1 - a.r0) : a.r * Math.abs(a.a1 - a.a0) * Math.PI / 180;
    a.t0 = start; a.t1 = start + Math.max(t1o - t0o, path / 1.8);
    // cada robot sale hacia su sitio en cuanto queda libre (no solo 1,3 s antes)
    const leave = Math.max(0, ...actRoles(a).map(id => free[id]));
    a.pre = Math.min(a.pre !== undefined ? a.pre + start - t0o : start - 1.3, Math.max(leave + 0.05, start - 6));
    if (a.t1 - t1o > D) { D = a.t1 - t1o; steps.push([t1o, D]); }
    const done = { p1: {}, p2: {}, p3: {} };
    poseAct(a, a.t1, done, {});
    for (const id of actRoles(a)) if (done[id].pos) { pos[id] = done[id].pos; free[id] = a.t1; }
  }
  // el resto de acciones (marcas, textos, líneas dadas…) se desplazan con el retraso de su momento
  for (const a of def.acts) {
    if (moving.includes(a)) continue;
    if (a.t1end !== undefined) a.t1end += Dat(a.t1end);
    if (a.t !== undefined) a.t += Dat(a.t);
    if (a.t0 !== undefined) { const d = Dat(a.t0); a.t0 += d; a.t1 += d; if (a.pre !== undefined) a.pre += d; }
  }
  if (def.overlay && def.overlay.at) def.overlay.at += Dat(def.overlay.at);
  // cada frase de la voz empieza cuando los robots han terminado lo anterior (ta = su sitio en el audio)
  sd.caps.forEach(c => { if (c.ta === undefined) c.ta = c.t; c.t = c.ta + Dat(c.ta); });
  const last = Math.max(0, ...moving.map(a => a.t1 + (a.hold ?? 0.6)));
  if (sd.durA === undefined) sd.durA = sd.dur;
  sd.dur = Math.max(sd.durA + D, last + 0.6);
}

function buildScenes() {
  RUN = SCENES.map((sd, i) => {
    const at = (k, f) => sd.caps[k].t + f * sd.caps[k].d;
    const def = (PLAN_ID === 'p2' && DEFS2[sd.id] ? DEFS2 : DEFS)[sd.id](at), auxC = AUX_COLORS[sd.id] || AUX_DEFAULT;
    retime(def, sd);  // horario realista; puede retrasar frases de la voz y alargar la escena
    // ejercicios de la escena en orden de aparición, cada uno con su color y sus materiales
    const groups = [];
    def.acts.filter(a => a.aux && a.grp).forEach(a => {
      let g = groups.find(x => x.id === a.grp);
      if (!g) groups.push(g = { id: a.grp, start: Infinity });
      g.start = Math.min(g.start, a.t0 ?? a.t);
    });
    groups.sort((x, y) => x.start - y.start);

    groups.forEach((g, k) => {

      g.mark = new THREE.MeshBasicMaterial({ color: g.color, transparent: true, opacity: 1 });
    });

    const lineMat = a => grpOf(a)?.line || auxMat(auxC);
    def.acts.forEach(a => {
      a.scene = i;
      if (a.k === 'arc' || a.k === 'semi') a.obj = ribbon(arcPoints(a.c, a.r, a.a0, a.a1), a.k === 'semi' ? 0.035 : 0.022, a.aux ? lineMat(a) : MAT.chalk);
      if (a.k === 'cline') a.obj = ribbon([polar(a.c, a.r0, a.a), polar(a.c, a.r1, a.a)], 0.035, MAT.chalk);
      if (a.k === 'line' && !a.dr) a.t1 = Math.min(a.t1, a.t0 + 0.25);  // líneas dadas (sin robot): aparecen de golpe, no se «dibujan» solas
      if (a.k === 'line') a.obj = ribbon([a.a, a.b], a.aux ? 0.025 : 0.035, a.aux ? lineMat(a) : MAT.chalk);
      if (a.k === 'seg') {
        a.obj = ribbon([a.a, a.b], 0.03, a.color ? segMat(a.color) : MAT.seg, 0.006);
        if (a.text) { a.lab = textSprite(a.text, a.color || '#ff9a5c', 0.24); a.lab.position.copy(W(add(mid(a.a, a.b), a.off || P(0, 0)), 0.25)); }
      }
      if (a.k === 'square') {
        // cuadrado construido hacia fuera sobre el lado a→b (a la derecha del sentido a→b), con cuadrícula n × n
        const u = sub(a.b, a.a), side = len(u), n = P(u.y / side, -u.x / side), c1 = add(a.b, mul(n, side)), c0 = add(a.a, mul(n, side));
        const grp = new THREE.Group(); grp.visible = false; scene.add(grp);
        const shape = new THREE.Shape([a.a, a.b, c1, c0].map(q => new THREE.Vector2(q.x, q.y)));
        a.mat = new THREE.MeshBasicMaterial({ color: a.color, transparent: true, opacity: 0, depthWrite: false });
        const mesh = new THREE.Mesh(new THREE.ShapeGeometry(shape), a.mat); mesh.rotation.x = -Math.PI / 2; mesh.position.y = 0.003; grp.add(mesh);
        for (let i = 0; i <= a.n; i++) {
          const f = i / a.n;
          for (const [p0, p1] of [[lerpP(a.a, a.b, f), lerpP(c0, c1, f)], [lerpP(a.a, c0, f), lerpP(a.b, c1, f)]]) {
            const r = ribbon([p0, p1], 0.018, segMat(a.color), 0.005); r.visible = true; setRibbon(r, 1); scene.remove(r); grp.add(r);
          }
        }
        a.obj = grp;
        a.lab = textSprite(a.label, a.color, 0.3); a.lab.position.copy(W(mid(a.a, c1), 0.3));
      }
      if (a.k === 'mark') {
        a.obj = crossMark(a.p, a.aux, auxC);
        if (a.aux && grpOf(a)) a.obj.children.forEach(c => c.material = grpOf(a).mark);
        const small = a.label === 'centro';
        if (a.label) {
          a.lab = textSprite(a.label, a.aux ? '#ffd24a' : '#f6f5ef', small ? 0.1 : (a.aux ? 0.2 : 0.26));
          const off = small ? P(0.0, -0.16) : P(0.17, -0.17);
          a.lab.position.copy(W(add(a.p, off), 0.2));
        }
      }
      if (a.k === 'text') { a.lab = textSprite(a.text, a.color, a.size || 0.26); a.lab.position.copy(W(a.p, 0.3)); }
    });
    return { data: sd, def, acts: def.acts, plan: !!def.plan, groups };
  });

const voiceEl = new Audio(); voiceEl.preload = 'auto'; voiceEl.dataset.scene = '-1';
function audioFor(i) { if (voiceEl.dataset.scene !== String(i)) { voiceEl.src = SCENES[i].audio; voiceEl.dataset.scene = String(i); } return voiceEl; }

// ¿Cuánto se ve de cada acción en la escena actual?  -1 = oculto
function progressOf(a, t) {
  const cur = S.i, here = a.scene === cur;
  const persistent = !a.aux && ['mark', 'line', 'semi'].includes(a.k);
  if (!here) return (RUN[cur].plan && RUN[a.scene].plan && a.scene < cur && persistent) ? 1 : -1;
  if (a.t1end !== undefined && t > a.t1end + 0.5) return -1;
  if (a.k === 'mark' || a.k === 'text') return t >= a.t ? ease((t - a.t) / 0.3) : -1;
  if (a.k === 'seg' || a.k === 'square') return t >= a.t ? ease((t - a.t) / 0.6) : -1;
  if (t < a.t0) return -1;
  return ease((t - a.t0) / (a.t1 - a.t0));
}

function robotHome(id, def) { return def.idle[id] || P(0, -3); }
function faceYaw(from, to) { return Math.atan2(to.x - from.x, -(to.y - from.y)); }

function desiredPoses(t) {
  const run = RUN[S.i], def = run.def, camP = P(camera.position.x, -camera.position.z);
  const want = {};
  for (const id of ['p1', 'p2', 'p3']) {
    const home = robotHome(id, def);
    want[id] = { pos: home, yaw: faceYaw(home, camP), L: null, R: null, poseL: 'rest', poseR: 'rest', chalk: false, lift: 0 };
  }
  const tools = { tapes: [], cords: [] };
  let focus = null;
  for (const a of run.acts) {
    if (a.t0 !== undefined && t >= a.t0) focus = a.k === 'tape' ? a.b : (a.k === 'line' ? a.b : (a.k === 'cline' ? polar(a.c, a.r1, a.a) : a.c));
    if (a.k === 'mark' && t >= a.t) focus = a.p;
    if ((a.k === 'square' || a.k === 'seg') && t >= a.t) focus = a.k === 'square' ? mid(a.a, a.b) : mid(a.a, a.b);
    if (a.k === 'text' && t >= a.t) focus = a.p;
  }
  // Las acciones que están trazando en este instante se aplican al final: así ningún robot se va
  // hacia el trazo siguiente (fase de preparación) mientras el actual aún se está dibujando.
  const busy = a => a.t0 !== undefined && t >= a.t0 && t <= a.t1;
  const ordered = [...run.acts.filter(a => !busy(a)), ...run.acts.filter(busy)];
  for (const a of ordered) {
    const start = a.pre ?? (a.t0 ?? a.t) - 1.3;
    if (t < start || t > actEnd(a)) continue;
    poseAct(a, t, want, tools);
  }
  // un robot sin tarea se queda donde terminó su último trabajo (no vuelve a su sitio inicial)
  const idle = [];
  for (const id of ['p1', 'p2', 'p3']) {
    if (want[id].pos !== robotHome(id, def)) continue;
    idle.push(id);
    const last = run.acts.filter(a => actEnd(a) < t && actRoles(a).includes(id)).sort((x, y) => actEnd(x) - actEnd(y)).pop();
    if (!last) continue;
    const tmp = { p1: {}, p2: {}, p3: {} };
    poseAct(last, last.t1 ?? last.t, tmp, {});
    if (tmp[id].pos) { want[id].pos = tmp[id].pos; want[id].yaw = faceYaw(tmp[id].pos, camP); }
  }
  // los robots sin tarea dejan sitio: nunca a menos de 0,8 m de otro robot
  for (let it = 0; it < 3; it++) for (const id of idle) for (const o of ['p1', 'p2', 'p3']) {
    if (o === id) continue;
    const d = sub(want[id].pos, want[o].pos), l = len(d);
    if (l < 0.8) { want[id].pos = add(want[id].pos, mul(l < 1e-3 ? P(0.6, -0.8) : mul(d, 1 / l), 0.8 - l)); want[id].yaw = faceYaw(want[id].pos, camP); }
  }
  // GALía señala lo último que se ha hecho
  if ((run.plan || def.present) && focus && !want.p1.R) {
    const w = want.p1, d = nrm(sub(focus, w.pos));
    w.yaw = faceYaw(w.pos, focus);
    w.R = add(w.pos, mul(d, 0.42)); w.Rh = 0.6; w.poseR = 'point';
  }
  return { want, tools };
}
const actEnd = a => (a.t1 ?? a.t) + (a.hold ?? 0.6);
function actRoles(a) {
  if (a.k === 'tape') return [a.z, a.tip];
  if (a.k === 'arc' || a.k === 'semi' || a.k === 'cline') return soloOf(a) ? [soloOf(a)] : [a.cen, a.tip];
  if (a.k === 'line' && a.ea) return [a.ea, a.eb, a.dr];
  return [];
}
function poseAct(a, t, want, tools) {
    const p = a.t0 !== undefined ? ease((t - a.t0) / (a.t1 - a.t0)) : 0;
    if (a.k === 'wave' && t >= a.t0 && t <= a.t1) { want[a.who].poseR = 'wave'; want[a.who].wave = true; }
    if (a.k === 'show' && t >= a.t0 && t <= a.t1) { want[a.who].show = true; }
    if (a.k === 'tape') {
      const tip = add(a.a, mul(sub(a.b, a.a), p));
      const u = nrm(sub(a.b, a.a));
      holdAt(want[a.z], a.a, a.b, 'R', 'press');
      holdAt(want[a.tip], tip, sub(tip, u), 'R', 'grip');
      if (t >= a.t0) (tools.tapes = tools.tapes || []).push({ a: a.a, tip, L: len(sub(a.b, a.a)) * p });
    }
    if (a.k === 'arc' || a.k === 'semi' || a.k === 'cline') {
      const tipAt = a.k === 'cline' ? polar(a.c, a.r0 + (a.r1 - a.r0) * p, a.a) : polar(a.c, a.r, a.a0 + (a.a1 - a.a0) * p);
      const drawing = t >= a.t0 && t <= a.t1;
      const so = soloOf(a);
      if (so) { compassSolo(want[so], a.c, tipAt); want[so].exactR = drawing; }
      else { holdAt(want[a.cen], a.c, tipAt, 'R', 'press'); holdAt(want[a.tip], tipAt, a.c, 'R', 'grip'); want[a.tip].chalk = true; want[a.tip].exactR = drawing; }
      (tools.cords = tools.cords || []).push({ a: a.c, b: tipAt, who: so || a.tip });
    }
    if (a.k === 'line' && a.ea) {
      const u = nrm(sub(a.b, a.a)), n = P(-u.y, u.x), off = mul(n, 0.045);
      holdAt(want[a.ea], add(a.a, off), a.b, 'R', 'press'); holdAt(want[a.eb], add(a.b, off), a.a, 'R', 'press');
      const tip = add(a.a, mul(sub(a.b, a.a), clamp01(p))), w = want[a.dr];
      w.pos = sub(tip, mul(n, 0.42)); w.yaw = faceYaw(w.pos, tip);
      w.R = tip; w.Rh = 0.075; w.poseR = 'grip'; w.chalk = true; w.exactR = t >= a.t0 && t <= a.t1;
      (tools.cords = tools.cords || []).push({ a: add(a.a, off), b: add(a.b, off), noChalk: true });
    }
}
function holdAt(w, point, other, side, pose) {
  const away = nrm(len(sub(point, other)) < 1e-3 ? P(0, -1) : sub(point, other));
  w.pos = add(point, mul(away, 0.4));
  w.yaw = faceYaw(w.pos, point);
  w[side] = point; w[side + 'h'] = pose === 'grip' ? 0.075 : 0.05; w['pose' + side] = pose;
}
function compassSolo(w, c, tip) {
  const u = nrm(sub(tip, c)), f = P(-u.y, u.x), m = mid(c, tip);
  w.pos = sub(m, mul(f, 0.62));
  w.yaw = Math.atan2(f.x, -f.y);
  w.L = c; w.Lh = 0.05; w.poseL = 'press';
  w.R = tip; w.Rh = 0.075; w.poseR = 'grip'; w.chalk = true;
}

function applyRobots(dt, t, want) {
  const k = 1 - Math.exp(-dt * 6), kh = 1 - Math.exp(-dt * 12);
  for (const [id, r] of Object.entries(ROB)) {
    const w = want[id];
    const target = new THREE.Vector3(w.pos.x, 0.09 + 0.018 * Math.sin(t * 2.2 + r.phase), -w.pos.y);
    // se acercan con suavidad pero sin pasar de una velocidad de paseo; el que traza puede ir algo más rápido
    const step = target.clone().sub(r.pos).multiplyScalar(w.exactR ? 1 - Math.exp(-dt * 12) : k);
    const vmax = (w.exactR ? 2.6 : 2.0) * dt, flat = Math.hypot(step.x, step.z);
    if (flat > vmax) { step.x *= vmax / flat; step.z *= vmax / flat; }
    if (S.snap) { r.pos.copy(target); r.yaw = w.yaw; } else r.pos.add(step);  // tras un salto en el tiempo, cada robot aparece ya en su sitio
    let dy = w.yaw - r.yaw; dy = Math.atan2(Math.sin(dy), Math.cos(dy)); r.yaw += dy * k;
    const shown = !RUN[S.i].def.only || RUN[S.i].def.only.includes(id);
    r.g.visible = shown; for (const s of ['L', 'R']) { r.arms[s].pod.visible = r.arms[s].hand.visible = shown; }
    if (!shown) { r.chalk = false; continue; }
    r.g.position.copy(r.pos); r.g.rotation.y = r.yaw;
    r.head.rotation.z = 0.05 * Math.sin(t * 1.3 + r.phase);
    // el frente del robot es +Z local, así que su derecha es -X local
    const right = new THREE.Vector3(-Math.cos(r.yaw), 0, Math.sin(r.yaw)), fwd = new THREE.Vector3(Math.sin(r.yaw), 0, Math.cos(r.yaw));
    for (const side of ['L', 'R']) {
      const sx = side === 'L' ? -1 : 1, arm = r.arms[side];
      const shoulder = r.pos.clone().addScaledVector(right, sx * 0.3).add(new THREE.Vector3(0, 0.5, 0));
      let hand;
      if (w[side]) hand = W(w[side], w[side + 'h'] ?? 0.06);
      else if (side === 'R' && w.wave) hand = shoulder.clone().addScaledVector(right, 0.08).add(new THREE.Vector3(0, 0.32, 0)).addScaledVector(right, 0.06 * Math.sin(t * 9));
      else if (w.show) hand = r.pos.clone().addScaledVector(fwd, 0.36).addScaledVector(right, side === 'R' ? 0.1 : -0.1).add(new THREE.Vector3(0, side === 'R' ? 0.66 : 0.52, 0));
      else hand = shoulder.clone().addScaledVector(fwd, 0.1).add(new THREE.Vector3(0, -0.28, 0));
      if (w['exact' + side] || S.snap) arm.pos.copy(hand); else arm.pos.lerp(hand, kh);  // la tiza no se queda atrás del trazo
      const toShoulder = new THREE.Vector3().subVectors(shoulder, arm.pos);
      const dist = toShoulder.length(); toShoulder.normalize();
      const podPos = arm.pos.clone().addScaledVector(toShoulder, Math.min(0.2, dist * 0.6));
      arm.pod.position.copy(podPos);
      arm.pod.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), toShoulder);
      arm.hand.position.copy(arm.pos);
      arm.hand.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), toShoulder);
      const pose = side === 'L' ? (w.show ? 'grip' : w.poseL) : (w.show ? 'grip' : w.poseR);
      setHandPose(arm.hand, pose);
    }
    r.chalk = w.chalk || w.show;
  }
}

function applyTools(tools, want) {
  // una tiza por robot que la lleve en la mano derecha
  const top = {};
  for (const [id, r] of Object.entries(ROB)) {
    const st = sticks[id]; st.visible = !!r.chalk && r.g.visible;
    if (st.visible) { const h = r.arms.R.pos; st.position.set(h.x, Math.max(0, h.y - 0.075), h.z); top[id] = st.position.clone().add(new THREE.Vector3(0, 0.092, 0)); }
  }
  const cords = [...tools.cords];
  if (!cords.length && ROB.p1.chalk && want.p1.show) cords.push({ show: true });
  cords.forEach((cd, i) => {
    const { c, l } = cordAt(i); c.visible = true; usedCords[i] = true;
    if (cd.show) { placeBetween(c, ROB.p1.arms.L.pos, top.p1); l.visible = false; return; }
    const a = W(cd.a, 0.012), b = cd.noChalk ? W(cd.b, 0.012) : (top[cd.who] || W(cd.b, 0.09));
    placeBetween(c, a, b); l.visible = true; l.position.copy(a);
  });
  for (let i = cords.length; i < usedCords.length; i++) if (usedCords[i]) { const { c, l } = cordAt(i); c.visible = l.visible = false; }
  tools.tapes.forEach((tp, i) => {
    const { m, k, lab } = tapeAt(i); usedTapes[i] = true;
    const a = W(tp.a, 0.004), b = W(tp.tip, 0.004);
    m.visible = k.visible = true; placeBetween(m, a, b, 'x');
    m.material.map.repeat.set(Math.max(tp.L, 0.001) / 0.2, 1);
    k.position.copy(b).add(new THREE.Vector3(0, 0.06, 0));
    setTapeLabel(fmtM(tp.L), a.clone().lerp(b, 0.5).add(new THREE.Vector3(0, 0.22, 0)), lab);
  });
  for (let i = tools.tapes.length; i < usedTapes.length; i++) if (usedTapes[i]) { const { m, k, lab } = tapeAt(i); m.visible = k.visible = false; if (lab.s) lab.s.visible = false; }
}

function applyDrawings(t) {
  const run = RUN[S.i];
  for (const r of RUN) for (const a of r.acts) {
    const p = progressOf(a, t);
    if (a.k === 'arc' || a.k === 'semi' || a.k === 'line' || a.k === 'cline') setRibbon(a.obj, p < 0 ? 0 : p);
    if (a.k === 'seg') { setRibbon(a.obj, p < 0 ? 0 : p); if (a.lab) a.lab.visible = p >= 0.9; }
    if (a.k === 'square') {
      const fade = a.t1end !== undefined && t > a.t1end ? 1 - clamp01((t - a.t1end) / 0.5) : 1;
      a.obj.visible = p >= 0; a.lab.visible = p >= 0.6 && fade > 0.5;
      if (p >= 0) { a.mat.opacity = 0.35 * p * fade; a.obj.children.forEach(c => { if (c.material !== a.mat) c.visible = fade > 0.3; }); }
    }
    if (a.k === 'mark') {
      a.obj.visible = p >= 0; if (a.lab) a.lab.visible = p >= 0;
      if (p >= 0) { const s = 0.2 + 0.8 * p; a.obj.scale.set(s, 1, s); }
    }
    if (a.k === 'text') a.lab.visible = p >= 0;
  }
  const gs = run.groups, cur = gs.reduce((c, g, k) => (t >= g.start ? k : c), -1);
  const level = age => (age <= 0 ? 1 : age === 1 ? 0.5 : 0);
  gs.forEach((g, k) => {
    const age = cur - k, f = cur >= 0 ? ease((t - gs[cur].start) / 1.0) : 1;
    g.op = level(age - 1) + (level(age) - level(age - 1)) * f;
    g.line.opacity = 0.9 * g.op; g.mark.opacity = g.op;
  });
  for (const a of run.acts) {
    if (!a.aux || !a.grp) continue;
    const g = gs.find(x => x.id === a.grp);
    if (a.obj) a.obj.visible = a.obj.visible && g.op > 0.02;
    if (a.lab) { a.lab.material.opacity = g.op; a.lab.visible = a.lab.visible && g.op > 0.02; }
  }
  const ov = run.def.overlay, fl = run.def.fills;
  OVER.grp.visible = !!ov && t >= ov.at; FILL.grp.visible = !!fl;
  if (ov) { const k = ease((t - ov.at) / 1.2); OVER.mats.forEach(m => m.opacity = ov.op * k); }
  if (fl) { const k = ease((t - 0.5) / 1.5); FILL.mats.forEach(m => m.opacity = 0.42 * k); }
  DIMS.forEach(s => s.visible = !!(ov && ov.dims) && t > 1.0);
  SITE.visible = !!run.def.site;  // la pared solo en las escenas que hablan del espacio (plano y paso 0)
  const cp = run.def.camp;
  CAMP.grp.visible = !!cp;
  CAMP.labels.forEach(l => l.visible = false);
  if (cp) {
    const out = 1 - ease((t - cp.out) / 0.8);
    const grow = (o, t0) => { const k = ease((t - t0) / 0.5) * out; o.visible = k > 0.01; o.scale.setScalar(Math.max(k, 0.01)); return k; };
    CAMP.tents.forEach((o, i) => grow(o, cp.tents + 0.35 * i));
    CAMP.stakes.forEach((o, i) => grow(o, cp.stakes + 0.12 * i));
    CAMP.labels.forEach((l, i) => l.visible = t > cp.tents + 0.35 * i * 2 + 0.5 && out > 0.5);
  }
}

// ------------------------------------------------------------ cámara
function camPreset(i) {
  const c = RUN[i].def.cam;
  return { pos: new THREE.Vector3(c[0], c[2], -c[1]), tgt: new THREE.Vector3(c[3], c[5], -c[4]) };
}
function flyCamera(i, instant) {
  const to = camPreset(i);
  const reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  if (instant || reduce) { camera.position.copy(to.pos); controls.target.copy(to.tgt); S.camTween = null; return; }
  S.camTween = { from: { pos: camera.position.clone(), tgt: controls.target.clone() }, to, t: 0 };
}
controls.addEventListener('start', () => { S.camTween = null; S.userCam = true; });

// ------------------------------------------------------------ interfaz
const $ = id => document.getElementById(id);
const MENU_GROUP = 'Métodos para perpendiculares';
let menuBtn = null, pop = null;
function buildStrip() {
  const strip = $('strip'); strip.innerHTML = '';
  let prev = null, cont = null;
  const seen = new Set();
  pop = document.createElement('div'); pop.className = 'pop'; pop.hidden = true; pop.setAttribute('role', 'menu'); document.body.append(pop);
  SCENES.forEach((s, i) => {
    if (s.group === MENU_GROUP) {
      if (!menuBtn) {
        menuBtn = document.createElement('button'); menuBtn.className = 'chip menu'; menuBtn.textContent = MENU_GROUP;
        menuBtn.setAttribute('aria-haspopup', 'menu'); menuBtn.setAttribute('aria-expanded', 'false');
        menuBtn.addEventListener('click', e => { e.stopPropagation(); togglePop(); });
        (cont || strip).append(menuBtn);
      }
      const b = document.createElement('button'); b.className = 'chip'; b.textContent = s.short; b.title = s.title; b.setAttribute('role', 'menuitem');
      b.addEventListener('click', () => { togglePop(false); goTo(i, true); }); pop.append(b); s.chip = b; s.inMenu = true;
      return;
    }
    if (s.group !== prev) {
      cont = document.createElement('div'); cont.className = 'grp';
      if (!seen.has(s.group)) cont.innerHTML = `<i>${s.group}</i>`;
      seen.add(s.group); strip.append(cont); prev = s.group;
    }
    const b = document.createElement('button'); b.className = 'chip'; b.textContent = s.short; b.title = s.title;
    b.addEventListener('click', () => goTo(i, true)); cont.append(b); s.chip = b;
  });
  document.addEventListener('click', e => { if (!pop.hidden && !pop.contains(e.target)) togglePop(false); });
  document.addEventListener('keydown', e => { if (e.key === 'Escape') togglePop(false); });
  strip.addEventListener('scroll', () => togglePop(false));
  window.addEventListener('resize', () => togglePop(false));
}
function togglePop(force) {
  if (!menuBtn) return;
  const open = force ?? pop.hidden;
  pop.hidden = !open; menuBtn.setAttribute('aria-expanded', String(open));
  if (open) { const r = menuBtn.getBoundingClientRect(); pop.style.left = Math.max(8, Math.min(r.left, innerWidth - pop.offsetWidth - 8)) + 'px'; pop.style.top = (r.bottom + 6) + 'px'; }
}
function updateStrip() {
  SCENES.forEach((s, i) => { s.chip.classList.toggle('on', i === S.i); s.chip.classList.toggle('done', i < S.i); s.chip.setAttribute('aria-current', i === S.i ? 'step' : 'false'); });
  const inMenu = SCENES[S.i].inMenu;
  if (menuBtn) {
    menuBtn.classList.toggle('part', !!inMenu);
    menuBtn.textContent = inMenu ? `${MENU_GROUP}: ${SCENES[S.i].short}` : MENU_GROUP;
  }
  (inMenu && menuBtn ? menuBtn : SCENES[S.i].chip).scrollIntoView({ block: 'nearest', inline: 'center', behavior: 'smooth' });
}
function updateCard() {
  const run = RUN[S.i], pnl = run.def.panel;
  $('tag').textContent = pnl.tag; $('ttl').textContent = run.data.title;
  $('bul').innerHTML = pnl.bullets.map(b => `<li>${b}</li>`).join('');
  $('fml').hidden = !pnl.formula; $('fml').textContent = pnl.formula || '';
  const showMini = !!pnl.hl; $('mini').hidden = !showMini; if (showMini) drawMini(pnl.hl);
}
function fmtT(s) { s = Math.max(0, s); return `${Math.floor(s / 60)}:${String(Math.floor(s % 60)).padStart(2, '0')}`; }
function updateBar() {
  const d = SCENES[S.i].dur; $('fill').style.width = `${100 * clamp01(S.t / d)}%`;
  $('time').textContent = `${fmtT(S.t)} / ${fmtT(d)}`;
  const cap = [...SCENES[S.i].caps].reverse().find(c => S.t >= c.t - 0.1);
  const txt = cap && S.t <= cap.t + cap.d + 0.8 ? cap.text : '';
  if ($('sub').textContent !== txt) $('sub').innerHTML = txt.replace(/GALía\d?/g, m => `<span class="who">${m}</span>`);
}
function setPlayIcon() { $('playIcon').innerHTML = S.playing ? '<path d="M6 4h4v16H6zm8 0h4v16h-4z"/>' : '<path d="M7 4v16l13-8z"/>'; }
function stopAudio() { voiceEl.pause(); }
function play() {
  S.playing = true; setPlayIcon();
  syncVoice(true);
}
function pause() { S.playing = false; setPlayIcon(); stopAudio(); }
// La voz sigue al reloj de la escena: dentro de una frase suena su trozo de audio; entre frases
// (mientras los robots terminan) se calla y espera.
function syncVoice(force) {
  if (!S.voice || !S.playing) return;
  const cap = SCENES[S.i].caps.find(c => S.t >= c.t && S.t < c.t + c.d + 0.15);
  const a = audioFor(S.i);
  if (!cap) { if (!a.paused) a.pause(); return; }
  const target = cap.ta + (S.t - cap.t);
  const set = () => { try { a.currentTime = target; } catch (e) {} };
  if (a.paused || force) {
    if (a.readyState >= 1) set(); else a.addEventListener('loadedmetadata', set, { once: true });
    a.play().catch(() => {});
  } else if (Math.abs(a.currentTime - target) > 0.35) set();
}
function goTo(i, autoplay) {
  if (i < 0 || i >= SCENES.length) return;
  stopAudio(); S.i = i; S.t = 0; S.userCam = false; S.snap = true;
  flyCamera(i); updateStrip(); updateCard(); updateBar();
  try { history.replaceState(null, '', '#' + SCENES[i].id); } catch (e) {}
  if (autoplay || S.playing) play();
}
function seek(frac) { S.t = clamp01(frac) * SCENES[S.i].dur; S.snap = true; if (S.playing) play(); updateBar(); }

$('go').addEventListener('click', () => { $('start').hidden = true; S.started = true; goTo(S.i, true); });
$('play').addEventListener('click', () => { if (!S.started) { $('go').click(); return; } S.playing ? pause() : (S.t >= SCENES[S.i].dur ? (S.t = 0, play()) : play()); });
$('prev').addEventListener('click', () => goTo(S.i - 1, S.started));
$('next').addEventListener('click', () => goTo(S.i + 1, S.started));
$('again').addEventListener('click', () => { S.t = 0; S.snap = true; flyCamera(S.i); S.userCam = false; if (S.started) play(); });
$('view').addEventListener('click', () => { flyCamera(S.i); S.userCam = false; });
$('voice').addEventListener('click', () => { S.voice = !S.voice; $('voice').setAttribute('aria-pressed', S.voice); stopAudio(); if (S.playing && S.voice) play(); });
$('auto').addEventListener('click', () => { S.auto = !S.auto; $('auto').setAttribute('aria-pressed', S.auto); });
$('cardToggle').addEventListener('click', () => setCardMin(!$('card').classList.contains('min')));
function setCardMin(v) { $('card').classList.toggle('min', v); $('cardToggle').textContent = v ? '+' : '–'; }
$('full').addEventListener('click', () => {
  const d = document, el = d.documentElement;
  if (d.fullscreenElement || d.webkitFullscreenElement) { (d.exitFullscreen || d.webkitExitFullscreen).call(d); return; }
  const req = el.requestFullscreen || el.webkitRequestFullscreen;
  const tab = () => { pause(); window.open(URL.createObjectURL(new Blob([PAGE], { type: 'text/html' })) + '#' + SCENES[S.i].id, '_blank'); };
  if (req && (d.fullscreenEnabled || d.webkitFullscreenEnabled)) Promise.resolve(req.call(el)).catch(tab); else tab();
});
const bar = $('bar');
bar.addEventListener('click', e => { const r = bar.getBoundingClientRect(); seek((e.clientX - r.left) / r.width); });
bar.addEventListener('keydown', e => { if (e.key === 'ArrowRight') seek((S.t + 3) / SCENES[S.i].dur); if (e.key === 'ArrowLeft') seek((S.t - 3) / SCENES[S.i].dur); });
window.addEventListener('keydown', e => {
  if (e.target.closest && e.target.closest('.bar')) return;
  if (e.key === ' ' && e.target === document.body) { e.preventDefault(); $('play').click(); }
  if (e.key === 'PageDown') goTo(S.i + 1, S.started);
  if (e.key === 'PageUp') goTo(S.i - 1, S.started);
});

// ------------------------------------------------------------ bucle
function resize() {
  const st = $('stage'), w = st.clientWidth, h = st.clientHeight;
  renderer.setSize(w, h, false); camera.aspect = w / Math.max(h, 1);
  // en pantallas estrechas (móvil en vertical) se abre el campo de visión para no recortar los lados
  const tanH = Math.tan(THREE.MathUtils.degToRad(21)) * 1.6;
  camera.fov = camera.aspect >= 1.6 ? 42 : Math.min(75, THREE.MathUtils.radToDeg(2 * Math.atan(tanH / camera.aspect)));
  camera.updateProjectionMatrix();
  const small = w < 600 || h < 380;
  if (small !== S.small) { S.small = small; setCardMin(small); }
}
window.addEventListener('resize', resize);
let last = performance.now();
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  if (S.playing) {
    S.t += dt; syncVoice();
    if (S.t >= SCENES[S.i].dur) {
      S.t = SCENES[S.i].dur;
      if (S.auto && S.i < SCENES.length - 1) goTo(S.i + 1, true); else pause();
    }
    updateBar();
  }
  const { want, tools } = desiredPoses(S.t);
  applyRobots(dt, performance.now() / 1000, want); S.snap = false;
  applyTools(tools, want);
  applyDrawings(S.t);
  if (S.camTween) {
    const tw = S.camTween; tw.t += dt / 1.6; const k = ease(tw.t);
    camera.position.lerpVectors(tw.from.pos, tw.to.pos, k); controls.target.lerpVectors(tw.from.tgt, tw.to.tgt, k);
    if (tw.t >= 1) S.camTween = null;
  }
  controls.update();
  sun.target.position.copy(controls.target); sun.position.copy(controls.target).add(new THREE.Vector3(6, 12, 8));
  renderer.render(scene, camera);
  requestAnimationFrame(frame);
}

if (!SCENES) {
  $('start').querySelector('p').textContent = 'Faltan los datos de las escenas: genera la página con construir.py.';
} else {
  const init = () => {
    buildScenes(); buildStrip();
    const fromHash = SCENES.findIndex(s => '#' + s.id === location.hash);
    S.i = fromHash >= 0 ? fromHash : 0;
    resize(); flyCamera(S.i, true); updateStrip(); updateCard(); updateBar();
    requestAnimationFrame(frame);
    // acceso directo: PCia.ir('paso3', 12) abre la escena en el segundo indicado (pausada)
    // revisión: simula cada escena y avisa si un trazo avanza sin que su robot esté trazándolo
    const revisar = () => {
      const out = [], keep = S.i, dt = 1 / 30;
      for (let i = 0; i < SCENES.length; i++) {
        S.i = i; const run = RUN[i];
        Object.entries(ROB).forEach(([id, r]) => { const h = robotHome(id, run.def); r.pos.set(h.x, 0.09, -h.y); });
        for (let t = 0; t < SCENES[i].dur; t += dt) {
          const { want } = desiredPoses(t); applyRobots(dt, t, want);
          const drawing = run.acts.filter(a => ['arc', 'semi', 'line', 'cline'].includes(a.k) && a.t0 !== undefined && t >= a.t0 && t <= a.t1);
          const who = drawing.map(a => a.k === 'line' ? (a.dr || '—') : (soloOf(a) || a.tip));
          if (new Set(who).size < who.length) out.push({ id: `${SCENES[i].id}: dos trazos a la vez con el mismo robot`, t, lag: 0 });
          drawing.forEach((a, k) => {
            if (who[k] === '—') { out.push({ id: `${SCENES[i].id} línea sin robot @${a.t0.toFixed(1)}`, t, lag: 0 }); return; }
            const r = ROB[who[k]], w = want[who[k]], lag = Math.hypot(r.pos.x - w.pos.x, -r.pos.z - w.pos.y);
            if (lag > 0.3) out.push({ id: `${SCENES[i].id} ${a.k}@${a.t0.toFixed(1)} (${who[k]})`, t, lag });
          });
        }
      }
      S.i = keep;
      const g = {}; out.forEach(o => { const e = g[o.id] || (g[o.id] = { n: 0, max: 0, t: o.t }); e.n++; e.max = Math.max(e.max, o.lag); });
      const ext = SCENES.filter(sd => sd.dur - sd.durA > 0.5).map(sd => `${sd.id} +${(sd.dur - sd.durA).toFixed(1)} s`).join(', ');
      return [...Object.entries(g).map(([id, e]) => `${id}: ${e.n} fotogramas, máx ${e.max.toFixed(2)} m, desde t=${e.t.toFixed(1)}`), 'Escenas alargadas: ' + (ext || 'ninguna')];
    };
    const horario = id => RUN[SCENES.findIndex(s => s.id === id)].acts.filter(a => a.t0 !== undefined).map(a => `${a.k} ${a.t0.toFixed(2)}–${a.t1.toFixed(2)} ${actRoles(a).join(',')}`);
    window.PCia = { revisar, horario, ir(id, t = 0) { const i = SCENES.findIndex(s => s.id === id); if (i < 0) return; $('start').hidden = true; S.started = true; pause(); goTo(i, false); S.t = t; S.snap = true; flyCamera(i, true); updateBar(); } };
  };
  // espera a las fuentes para que los rótulos 3D salgan con la tipografía correcta
  Promise.race([document.fonts.ready, new Promise(r => setTimeout(r, 1500))]).then(init);
}
</script>
