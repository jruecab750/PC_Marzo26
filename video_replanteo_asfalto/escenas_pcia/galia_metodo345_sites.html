<body>
<title>GALía: método 3-4-5</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Barlow+Condensed:wght@600;700&family=JetBrains+Mono:wght@500&display=swap">
<style>
:root {
  color-scheme: dark;
  --bg: #15181b;
  --panel: rgba(24, 28, 32, 0.86);
  --panel-solid: #1c2125;
  --line: #2f363c;
  --ink: #f4f2ee;
  --muted: #a3acb5;
  --orange: #ff6b1a;
  --orange-deep: #d9500a;
  --cyan: #3fd4ff;
  --tape: #f2c230;
  --ok: #5ce39a;
  --display: "Barlow Condensed", "Arial Narrow", "Roboto Condensed", sans-serif;
  --body: "Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
  --mono: "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
html, body { height: 100%; }
[hidden] { display: none !important; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 15px; overflow: hidden; }
#app { height: 100%; display: flex; flex-direction: column; }
button { font: inherit; color: inherit; }
button:focus-visible, [tabindex]:focus-visible { outline: 2px solid var(--cyan); outline-offset: 2px; }

/* Barra superior: marca + selector de escenas */
.top { position: relative; z-index: 3; display: flex; align-items: center; gap: 14px; padding: 8px 16px; background: var(--panel-solid); border-bottom: 1px solid var(--line); min-width: 0; }
.brand { display: flex; align-items: baseline; gap: 8px; flex: none; }
.brand b { font-family: var(--display); font-size: 24px; letter-spacing: 0.02em; color: var(--orange); line-height: 1; }
.brand span { font-family: var(--display); font-size: 17px; color: var(--muted); letter-spacing: 0.04em; text-transform: uppercase; white-space: nowrap; }
.strip { display: flex; gap: 14px; overflow-x: auto; scrollbar-width: thin; min-width: 0; flex: 1; padding-bottom: 2px; }
.grp { display: flex; align-items: center; gap: 5px; flex: none; }
.grp > i { font-style: normal; font-family: var(--display); font-size: 13px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); margin-right: 2px; }
.chip { border: 1px solid var(--line); background: transparent; border-radius: 6px; padding: 5px 9px; cursor: pointer; font-family: var(--display); font-size: 16px; letter-spacing: 0.02em; white-space: nowrap; color: var(--ink); }
.chip:hover { border-color: var(--muted); }
.chip.done { color: var(--muted); }
.chip.on { background: var(--orange); border-color: var(--orange); color: #1a0d04; }
.chip.menu::after { content: " ▾"; }
.chip.menu.part { border-color: var(--orange); color: var(--orange); }
.pop { position: fixed; z-index: 20; display: flex; flex-direction: column; gap: 4px; padding: 6px; background: var(--panel-solid); border: 1px solid var(--line); border-radius: 8px; box-shadow: 0 8px 24px rgba(0, 0, 0, 0.45); }
.pop .chip { text-align: left; }

/* Escenario */
.stage { position: relative; flex: 1; min-height: 0; overflow: hidden; }
#gl { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
.card { position: absolute; top: 12px; left: 12px; width: min(330px, calc(100% - 24px)); background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; backdrop-filter: blur(6px); display: flex; flex-direction: column; gap: 8px; max-height: calc(100% - 24px); overflow-y: auto; box-sizing: border-box; }
.card .tag { font-family: var(--display); font-size: 14px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--orange); }
.card h1 { margin: 0; font-family: var(--display); font-weight: 700; font-size: 26px; line-height: 1.05; text-wrap: balance; }
.card ul { margin: 0; padding-left: 18px; display: flex; flex-direction: column; gap: 3px; line-height: 1.35; }
.card li::marker { color: var(--tape); }
.card .formula { font-family: var(--mono); font-size: 13px; color: var(--tape); border: 1px solid rgba(242, 194, 48, 0.45); border-radius: 6px; padding: 6px 8px; }
.card canvas { align-self: center; width: 150px; height: 150px; }
.card .toggle { position: absolute; top: 8px; right: 8px; border: 0; background: transparent; cursor: pointer; color: var(--muted); font-size: 18px; line-height: 1; padding: 4px; }
.card.min { width: auto; padding: 8px 40px 8px 12px; }
.card.min > :not(.tag):not(.toggle) { display: none; }
.sub { position: absolute; left: 50%; bottom: 14px; transform: translateX(-50%); width: min(900px, calc(100% - 32px)); text-align: center; font-size: clamp(16px, 2.1vw, 22px); line-height: 1.35; background: rgba(10, 12, 14, 0.78); border-radius: 8px; padding: 8px 14px; text-wrap: balance; }
.sub:empty { display: none; }
.who { color: var(--orange); font-weight: 700; }

/* Portada */
.start { position: absolute; inset: 0; display: grid; place-items: center; background: radial-gradient(ellipse at 50% 40%, rgba(21, 24, 27, 0.35), rgba(21, 24, 27, 0.88)); }
.start > div { text-align: center; display: flex; flex-direction: column; gap: 12px; align-items: center; padding: 0 16px; }
.start h2 { margin: 0; font-family: var(--display); font-size: clamp(40px, 7vw, 72px); line-height: 0.95; letter-spacing: 0.01em; }
.start h2 em { font-style: normal; color: var(--orange); }
.start p { margin: 0; color: var(--muted); max-width: 46ch; line-height: 1.45; }
.go { border: 0; background: var(--orange); color: #1a0d04; font-family: var(--display); font-weight: 700; font-size: 24px; letter-spacing: 0.04em; border-radius: 8px; padding: 10px 28px; cursor: pointer; }
.go:hover { background: #ff8340; }

/* Controles */
.ctl { position: relative; z-index: 3; display: flex; align-items: center; gap: 8px; padding: 8px 16px calc(8px + env(safe-area-inset-bottom, 0px)); background: var(--panel-solid); border-top: 1px solid var(--line); flex-wrap: wrap; }
.btn { border: 1px solid var(--line); background: transparent; border-radius: 6px; min-width: 38px; height: 36px; padding: 0 10px; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 6px; }
.btn:hover { border-color: var(--muted); }
.btn.main { background: var(--ink); color: var(--bg); border-color: var(--ink); min-width: 46px; }
.btn[aria-pressed="false"] { color: var(--muted); }
.bar { flex: 1; min-width: 120px; height: 36px; display: flex; align-items: center; cursor: pointer; }
.bar > div { position: relative; height: 6px; width: 100%; background: var(--line); border-radius: 3px; }
.bar b { position: absolute; left: 0; top: 0; bottom: 0; background: var(--orange); border-radius: 3px; }
.bar s { position: absolute; top: -3px; width: 2px; height: 12px; background: rgba(244, 242, 238, 0.35); text-decoration: none; }
.time { font-family: var(--mono); font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; min-width: 86px; text-align: right; }
.btn svg { width: 18px; height: 18px; fill: currentColor; }
.btn .lbl { font-size: 13px; }
@media (max-width: 720px) {
  .brand span { display: none; }
  .card { top: 8px; left: 8px; }
  .card canvas { width: 110px; height: 110px; }
  .card h1 { font-size: 21px; }
  .btn .lbl { display: none; }
  .time { display: none; }
  .top { padding: 6px 8px; gap: 8px; }
  .brand b { font-size: 21px; }
  .strip { gap: 10px; }
  .chip { font-size: 15px; padding: 4px 8px; }
  .ctl { flex-wrap: nowrap; gap: 4px; padding: 6px 8px calc(6px + env(safe-area-inset-bottom, 0px)); }
  .btn { min-width: 32px; height: 32px; padding: 0 6px; }
  .btn.main { min-width: 38px; }
  .bar { min-width: 40px; height: 32px; }
  .sub { bottom: 6px; width: calc(100% - 16px); box-sizing: border-box; font-size: 14px; padding: 5px 8px; }
  .card { max-height: calc(100% - 16px); padding: 10px 12px; }
  .start p { font-size: 13px; }
  .go { font-size: 20px; padding: 8px 22px; }
}
@media (max-width: 420px) { #auto { display: none; } }
@media (max-height: 520px) {
  .sub { font-size: 14px; bottom: 6px; padding: 5px 8px; }
  .card canvas { display: none; }
  .start h2 { font-size: 34px; }
  .start p { display: none; }
}
@media (max-height: 320px) { .sub { font-size: 12.5px; line-height: 1.25; padding: 4px 8px; } }
body.reel .top, body.reel .ctl, body.reel .card, body.reel .sub, body.reel .start { display: none !important; }
body.reel.subs .sub:not(:empty) { display: block !important; }  /* vídeo horizontal con subtítulos */
@media (prefers-reduced-motion: reduce) { .chip, .btn { transition: none; } }
</style>

<div id="app">
  <header class="top">
    <div class="brand"><b>GALía</b><span>Método 3-4-5</span></div>

  </header>

      <div class="tag" id="tag"></div>
      <h1 id="ttl"></h1>
      <ul id="bul"></ul>
      <div class="formula" id="fml" hidden></div>
      <canvas id="mini" width="300" height="300" hidden></canvas>
      <button class="toggle" id="cardToggle" aria-label="Plegar o desplegar la ficha">–</button>
    </aside>
    <div class="sub" id="sub" aria-live="polite"></div>
    <div class="start" id="start">
      <div>
        <h2><em>GALía</em>: método<br>3-4-5</h2>
        <p>Escenas en 3D con voz: perpendicular a una semirrecta en su extremo con el método 3-4-5, con unidades iguales marcadas con arcos y una regla de 1 m. Arrastra para girar la vista.</p>
        <button class="go" id="go">Empezar</button>
      </div>
    </div>
  </main>
  <footer class="ctl">
    <button class="btn" id="prev" aria-label="Escena anterior"><svg viewBox="0 0 24 24"><path d="M6 5h2v14H6zM20 5v14L9 12z"/></svg></button>
    <button class="btn main" id="play" aria-label="Reproducir o pausar"><svg viewBox="0 0 24 24" id="playIcon"><path d="M7 4v16l13-8z"/></svg></button>
    <button class="btn" id="next" aria-label="Escena siguiente"><svg viewBox="0 0 24 24"><path d="M16 5h2v14h-2zM4 5v14l11-7z"/></svg></button>
    <button class="btn" id="again" aria-label="Repetir la escena"><svg viewBox="0 0 24 24"><path d="M12 5V2L7 6l5 4V7a5 5 0 1 1-5 5H5a7 7 0 1 0 7-7z"/></svg><span class="lbl">Repetir</span></button>
    <div class="bar" id="bar" role="slider" aria-label="Posición en la escena" tabindex="0"><div><b id="fill"></b></div></div>
    <span class="time" id="time">0:00 / 0:00</span>
    <button class="btn" id="voice" aria-pressed="true"><svg viewBox="0 0 24 24"><path d="M4 9v6h4l5 4V5L8 9zm12.5 3a4.5 4.5 0 0 0-2.5-4v8a4.5 4.5 0 0 0 2.5-4z"/></svg><span class="lbl">Voz</span></button>
    <button class="btn" id="auto" aria-pressed="true"><svg viewBox="0 0 24 24"><path d="M4 6h10v2H4zm0 5h10v2H4zm0 5h6v2H4zm12-5 5 3.5-5 3.5z"/></svg><span class="lbl">Seguir solo</span></button>
    <button class="btn" id="view" aria-label="Volver a la vista de la escena"><svg viewBox="0 0 24 24"><path d="M12 5c-5 0-9 5-9 7s4 7 9 7 9-5 9-7-4-7-9-7zm0 11a4 4 0 1 1 0-8 4 4 0 0 1 0 8z"/></svg><span class="lbl">Vista</span></button>
    <button class="btn" id="full" aria-label="Pantalla completa"><svg viewBox="0 0 24 24"><path d="M4 4h6v2H6v4H4zm10 0h6v6h-2V6h-4zM4 14h2v4h4v2H4zm14 0h2v6h-6v-2h4z"/></svg></button>
  </footer>
</div>

function applyRobots(dt, t, want) {
  const k = 1 - Math.exp(-dt * 6), kh = 1 - Math.exp(-dt * 12);
  for (const [id, r] of Object.entries(ROB)) {

    // se acercan con suavidad pero sin pasar de una velocidad de paseo; el que traza puede ir algo más rápido

    let dy = w.yaw - r.yaw; dy = Math.atan2(Math.sin(dy), Math.cos(dy)); r.yaw += dy * k;
    const shown = !RUN[S.i].def.only || RUN[S.i].def.only.includes(id);
    r.g.visible = shown; for (const s of ['L', 'R']) { r.arms[s].pod.visible = r.arms[s].hand.visible = shown; }
    if (!shown) { r.chalk = false; continue; }
    r.g.position.copy(r.pos); r.g.rotation.y = r.yaw;
    r.head.rotation.z = 0.05 * Math.sin(t * 1.3 + r.phase);

      const shoulder = r.pos.clone().addScaledVector(right, sx * 0.3).add(new THREE.Vector3(0, 0.5, 0));
      let hand;
      if (w[side]) hand = W(w[side], w[side + 'h'] ?? 0.06);
      else if (side === 'R' && w.wave) hand = shoulder.clone().addScaledVector(right, 0.08).add(new THREE.Vector3(0, 0.32, 0)).addScaledVector(right, 0.06 * Math.sin(t * 9));

      else if (w.show) hand = r.pos.clone().addScaledVector(fwd, 0.36).addScaledVector(right, side === 'R' ? 0.1 : -0.1).add(new THREE.Vector3(0, side === 'R' ? 0.66 : 0.52, 0));

      arm.hand.position.copy(arm.pos);

function applyTools(tools, want) {

function applyRuler(t) {

function applyDrawings(t) {
  const run = RUN[S.i];
  for (const r of RUN) for (const a of r.acts) {
    const p = progressOf(a, t);
    if (a.k === 'arc' || a.k === 'semi' || a.k === 'line' || a.k === 'cline' || a.k === 'rline') setRibbon(a.obj, p < 0 ? 0 : p);
    if (a.k === 'seg') { setRibbon(a.obj, p < 0 ? 0 : p); if (a.lab) a.lab.visible = p >= 0.9; }
    if (a.k === 'square') {
      const fade = a.t1end !== undefined && t > a.t1end ? 1 - clamp01((t - a.t1end) / 0.5) : 1;
      a.obj.visible = p >= 0; a.lab.visible = p >= 0.6 && fade > 0.5;
      if (p >= 0) { a.mat.opacity = 0.35 * p * fade; a.obj.children.forEach(c => { if (c.material !== a.mat) c.visible = fade > 0.3; }); }
    }

      a.obj.visible = p >= 0; if (a.lab) a.lab.visible = p >= 0;
      if (p >= 0) { const s = 0.2 + 0.8 * p; a.obj.scale.set(s, 1, s); }

  gs.forEach((g, k) => {
    const age = cur - k, f = cur >= 0 ? ease((t - gs[cur].start) / 1.0) : 1;
    g.op = level(age - 1) + (level(age) - level(age - 1)) * f;
    g.line.opacity = 0.9 * g.op; g.mark.opacity = g.op;
  });
  for (const a of run.acts) {
    if (!a.aux || !a.grp) continue;
    const g = gs.find(x => x.id === a.grp);
    if (a.obj) a.obj.visible = a.obj.visible && g.op > 0.02;
    if (a.lab) { a.lab.material.opacity = g.op; a.lab.visible = a.lab.visible && g.op > 0.02; }

  if (fl) { const k = ease((t - 0.5) / 1.5); FILL.mats.forEach(m => m.opacity = 0.42 * k); }

  if (cp) {
    const out = 1 - ease((t - cp.out) / 0.8);
    const grow = (o, t0) => { const k = ease((t - t0) / 0.5) * out; o.visible = k > 0.01; o.scale.setScalar(Math.max(k, 0.01)); return k; };

    CAMP.labels.forEach((l, i) => l.visible = t > cp.tents + 0.35 * i * 2 + 0.5 && out > 0.5);
  }
}

const $ = id => document.getElementById(id);

function buildStrip() {
  const strip = $('strip'); strip.innerHTML = '';
  let prev = null, cont = null;
  const seen = new Set();
  pop = document.createElement('div'); pop.className = 'pop'; pop.hidden = true; pop.setAttribute('role', 'menu'); document.body.append(pop);
  SCENES.forEach((s, i) => {
    if (s.group === MENU_GROUP) {
      if (!menuBtn) {
        menuBtn = document.createElement('button'); menuBtn.className = 'chip menu'; menuBtn.textContent = MENU_GROUP;
        menuBtn.setAttribute('aria-haspopup', 'menu'); menuBtn.setAttribute('aria-expanded', 'false');

        (cont || strip).append(menuBtn);

      b.addEventListener('click', () => { togglePop(false); goTo(i, true); }); pop.append(b); s.chip = b; s.inMenu = true;

function syncVoice(force) {

  if (d.fullscreenElement || d.webkitFullscreenElement) { (d.exitFullscreen || d.webkitExitFullscreen).call(d); return; }
  const req = el.requestFullscreen || el.webkitRequestFullscreen;
  const tab = () => { pause(); window.open(URL.createObjectURL(new Blob([PAGE], { type: 'text/html' })) + '#' + SCENES[S.i].id, '_blank'); };
  if (req && (d.fullscreenEnabled || d.webkitFullscreenEnabled)) Promise.resolve(req.call(el)).catch(tab); else tab();
});
const bar = $('bar');
bar.addEventListener('click', e => { const r = bar.getBoundingClientRect(); seek((e.clientX - r.left) / r.width); });
bar.addEventListener('keydown', e => { if (e.key === 'ArrowRight') seek((S.t + 3) / SCENES[S.i].dur); if (e.key === 'ArrowLeft') seek((S.t - 3) / SCENES[S.i].dur); });
window.addEventListener('keydown', e => {
  if (e.target.closest && e.target.closest('.bar')) return;
  if (e.key === ' ' && e.target === document.body) { e.preventDefault(); $('play').click(); }
  if (e.key === 'PageDown') goTo(S.i + 1, S.started);
  if (e.key === 'PageUp') goTo(S.i - 1, S.started);
});

// ------------------------------------------------------------ bucle
function resize() {
  const st = $('stage'), w = st.clientWidth, h = st.clientHeight;
  renderer.setSize(w, h, false); camera.aspect = w / Math.max(h, 1);
  // en pantallas estrechas (móvil en vertical) se abre el campo de visión para no recortar los lados
  const tanH = Math.tan(THREE.MathUtils.degToRad(21)) * 1.6;
  camera.fov = S.fovFix ? S.fovFix  // grabación de vídeo: campo de visión fijo
    : camera.aspect >= 1.6 ? 42 : Math.min(75, THREE.MathUtils.radToDeg(2 * Math.atan(tanH / camera.aspect)));
  camera.updateProjectionMatrix();
  const small = w < 600 || h < 380;
  if (small !== S.small) { S.small = small; setCardMin(small); }
}
window.addEventListener('resize', resize);
let last = performance.now();
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  if (!S.manual) tick(dt, now / 1000);
  requestAnimationFrame(frame);
}
// Un paso de la animación (el bucle normal o la grabación fotograma a fotograma)
function tick(dt, clock) {
  if (S.playing) {
    S.t += dt; syncVoice();
    if (S.t >= SCENES[S.i].dur) {
      S.t = SCENES[S.i].dur;
      if (S.auto && S.i < SCENES.length - 1) goTo(S.i + 1, true); else pause();
    }
    updateBar();
  }
  const { want, tools } = desiredPoses(S.t);
  applyRobots(dt, clock, want); S.snap = false;
  applyTools(tools, want); applyRuler(S.t);
  applyDrawings(S.t);
  const ck = RUN[S.i].def.camKeys;   // cámara que sigue el guion (método 3-4-5) mientras no la mueva el usuario
  if (ck && !S.userCam && !S.camTween) {
    let i = 0; while (i < ck.length - 1 && S.t >= ck[i + 1][0]) i++;
    const [ta, ca] = ck[i], [tb, cb] = ck[Math.min(i + 1, ck.length - 1)], k = tb > ta ? ease((S.t - ta) / (tb - ta)) : 0;
    const c = ca.map((v, j) => v + (cb[j] - v) * k);
    camera.position.set(c[0], c[2], -c[1]); controls.target.set(c[3], c[5], -c[4]);
  }
  if (S.camTween) {
    const tw = S.camTween; tw.t += dt / 1.6; const k = ease(tw.t);
    camera.position.lerpVectors(tw.from.pos, tw.to.pos, k); controls.target.lerpVectors(tw.from.tgt, tw.to.tgt, k);
    if (tw.t >= 1) S.camTween = null;
  }
  controls.update();
  sun.target.position.copy(controls.target); sun.position.copy(controls.target).add(new THREE.Vector3(6, 12, 8));
  renderer.render(scene, camera);
}

if (!SCENES) {
  $('start').querySelector('p').textContent = 'Faltan los datos de las escenas: genera la página con construir.py.';
} else {
  const init = () => {
    buildScenes(); buildStrip();
    const fromHash = SCENES.findIndex(s => '#' + s.id === location.hash);
    S.i = fromHash >= 0 ? fromHash : 0;
    resize(); flyCamera(S.i, true); updateStrip(); updateCard(); updateBar();
    requestAnimationFrame(frame);
    // acceso directo: PCia.ir('paso3', 12) abre la escena en el segundo indicado (pausada)
    // revisión: simula cada escena y avisa si un trazo avanza sin que su robot esté trazándolo
    const revisar = () => {
      const out = [], keep = S.i, dt = 1 / 30;
      for (let i = 0; i < SCENES.length; i++) {
        S.i = i; const run = RUN[i];
        Object.entries(ROB).forEach(([id, r]) => { const h = robotHome(id, run.def); r.pos.set(h.x, 0.09, -h.y); });
        for (let t = 0; t < SCENES[i].dur; t += dt) {
          const { want } = desiredPoses(t); applyRobots(dt, t, want);
          const drawing = run.acts.filter(a => ['arc', 'semi', 'line', 'cline', 'rline'].includes(a.k) && a.t0 !== undefined && t >= a.t0 && t <= a.t1);
          const who = drawing.map(a => a.k === 'line' ? (a.dr || '—') : a.k === 'rline' ? a.who : (soloOf(a) || a.tip));
          if (new Set(who).size < who.length) out.push({ id: `${SCENES[i].id}: dos trazos a la vez con el mismo robot`, t, lag: 0 });
          drawing.forEach((a, k) => {
            if (who[k] === '—') { out.push({ id: `${SCENES[i].id} línea sin robot @${a.t0.toFixed(1)}`, t, lag: 0 }); return; }
            const r = ROB[who[k]], w = want[who[k]], lag = Math.hypot(r.pos.x - w.pos.x, -r.pos.z - w.pos.y);
            if (lag > 0.3) out.push({ id: `${SCENES[i].id} ${a.k}@${a.t0.toFixed(1)} (${who[k]})`, t, lag });
          });
        }
      }
      S.i = keep;
      const g = {}; out.forEach(o => { const e = g[o.id] || (g[o.id] = { n: 0, max: 0, t: o.t }); e.n++; e.max = Math.max(e.max, o.lag); });
      const ext = SCENES.filter(sd => sd.dur - sd.durA > 0.5).map(sd => `${sd.id} +${(sd.dur - sd.durA).toFixed(1)} s`).join(', ');
      return [...Object.entries(g).map(([id, e]) => `${id}: ${e.n} fotogramas, máx ${e.max.toFixed(2)} m, desde t=${e.t.toFixed(1)}`), 'Escenas alargadas: ' + (ext || 'ninguna')];
    };
    const horario = id => RUN[SCENES.findIndex(s => s.id === id)].acts.filter(a => a.t0 !== undefined).map(a => `${a.k} ${a.t0.toFixed(2)}–${a.t1.toFixed(2)} ${actRoles(a).join(',')}`);
    const grabar = {
      empezar(id, t = 0, cam) {  // entra en modo grabación en la escena id, instante t
        document.body.classList.add('reel'); S.fovFix = 50; resize();
        $('start').hidden = true; S.started = true; pause(); goTo(SCENES.findIndex(s => s.id === id), false);
        S.t = t; S.snap = true; S.manual = true; S.clock = 0; S.camTween = null;
        if (cam) { grabar.camara(cam); S.userCam = true; } else flyCamera(S.i, true);
        for (let i = 0; i < 20; i++) grabar.paso(0);
      },
      camara(c) { camera.position.set(c[0], c[2], -c[1]); controls.target.set(c[3], c[5], -c[4]); controls.update(); },
      paso(dt) { S.t += dt; S.clock += dt; tick(dt, S.clock); updateBar(); },
      subtitulos(on) { document.body.classList.toggle('subs', on); },
      escenas: () => SCENES.map(s => ({ id: s.id, dur: s.dur, caps: s.caps.map(c => ({ t: c.t, ta: c.ta, d: c.d })) })),
    };
    window.PCia = { revisar, horario, grabar, ir(id, t = 0) { const i = SCENES.findIndex(s => s.id === id); if (i < 0) return; $('start').hidden = true; S.started = true; pause(); goTo(i, false); S.t = t; S.snap = true; flyCamera(i, true); updateBar(); } };
  };
  // espera a las fuentes para que los rótulos 3D salgan con la tipografía correcta
  Promise.race([document.fonts.ready, new Promise(r => setTimeout(r, 1500))]).then(init);
}
</script>
